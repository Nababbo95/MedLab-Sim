<style>

*{box-sizing:border-box}
body{margin:0;color:var(--tx);font-family:'Inter',system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.55;min-height:100vh;
background:radial-gradient(900px 500px at 85% -10%,rgba(13,148,136,.18),transparent 60%),radial-gradient(700px 400px at -10% 10%,rgba(14,116,144,.14),transparent 60%),var(--pat),var(--bg);background-attachment:fixed}
main{max-width:1000px;margin:0 auto;padding:56px 22px 24px}
.eyebrow{display:inline-block;font-size:.75rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ac);background:rgba(13,148,136,.1);border:1px solid rgba(13,148,136,.25);padding:4px 12px;border-radius:99px;margin-bottom:14px}
h1{font-family:'Fraunces',Georgia,serif;font-weight:700;font-size:clamp(2.3rem,6vw,3.6rem);line-height:1.05;margin:0 0 12px;letter-spacing:-.02em;background:linear-gradient(120deg,var(--tx) 30%,var(--ac) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mu);font-size:1.1rem;margin:0 0 32px;max-width:560px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{position:relative;display:block;background:var(--card);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--bd);border-radius:18px;padding:22px;text-decoration:none;color:inherit;box-shadow:var(--sh);overflow:hidden;transition:transform .2s,border-color .2s,box-shadow .2s}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--ac),var(--ac2));opacity:0;transition:opacity .2s}
.card:hover{transform:translateY(-4px);border-color:var(--ac)}.card:hover::before{opacity:1}
.ic{width:52px;height:52px;display:grid;place-items:center;font-size:1.7rem;border-radius:14px;background:linear-gradient(135deg,rgba(13,148,136,.16),rgba(14,116,144,.1))}
.card h2{font-family:'Fraunces',Georgia,serif;font-size:1.25rem;margin:14px 0 4px}
.card p{margin:0;color:var(--mu);font-size:.93rem}
.tag{display:inline-block;margin-top:10px;font-size:.72rem;color:var(--ac);border:1px solid var(--ac);border-radius:99px;padding:0 9px}
.del{position:absolute;top:10px;right:10px;border:0;background:none;color:var(--dg);cursor:pointer;font-size:1rem}
.bar{display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.back{color:var(--ac);text-decoration:none;font-weight:600;background:var(--card);border:1px solid var(--bd);border-radius:99px;padding:6px 14px}
.bar h2{margin:0;font-family:'Fraunces',Georgia,serif;font-size:1.4rem}
iframe{width:100%;height:calc(100vh - 150px);min-height:480px;border:1px solid var(--bd);border-radius:16px;background:#fff;box-shadow:var(--sh)}
.simwrap{position:relative}
.simwrap.fs{position:fixed;inset:0;height:100dvh;z-index:50;background:var(--bg)}
.simwrap.fs iframe{height:100%;min-height:0;border:0;border-radius:0;box-shadow:none}
.fsctl{display:none;position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:10px;z-index:2;gap:6px;opacity:.92}
.simwrap.fs .fsctl{display:flex}
.notice{margin:-18px 0 28px;font-size:.8rem;color:var(--mu);opacity:.8}
.gstats{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;margin-bottom:14px;font-weight:500}
.gmsg{min-height:1.6em;margin:0 0 12px;font-weight:600;color:var(--ac)}
.gboard{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:360px}
.gcell{aspect-ratio:1;border:1px solid var(--bd);border-radius:16px;background:var(--card);box-shadow:var(--sh);font-size:clamp(2rem,12vw,3rem);cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;padding:0}
.gcell.on{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac);transform:scale(1.04)}
#theme{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;z-index:40;width:42px;height:42px;border-radius:50%;border:1px solid var(--bd);background:var(--card);cursor:pointer;font-size:1.1rem;box-shadow:var(--sh)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:99px;z-index:60;font-size:.9rem}
.thumb{margin:-22px -22px 14px;height:130px;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.edt{right:40px;color:var(--ac)}
.stats{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 22px;font-size:.88rem}
.chip{background:var(--card);border:1px solid var(--bd);border-radius:99px;padding:4px 12px}
.stats a{color:var(--ac);text-decoration:none;font-weight:600;padding:4px}
.views{display:block;margin-top:8px;font-size:.8rem;color:var(--mu)}
.adm{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
button.b{font:inherit;font-weight:500;padding:9px 16px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer}
button.p{background:linear-gradient(135deg,var(--ac),var(--ac2));border-color:transparent;color:#fff}
footer{text-align:center;padding:36px 20px 28px;color:var(--mu);font-size:.82rem}
.credit{margin-bottom:6px;letter-spacing:.02em}.credit b{font-weight:600;color:var(--tx)}
#lock{background:none;border:0;color:var(--mu);cursor:pointer;opacity:.4;font-size:.85rem}
dialog{border:1px solid var(--bd);border-radius:18px;background:var(--bg);color:var(--tx);width:min(560px,92vw);padding:22px;box-shadow:var(--sh)}
dialog::backdrop{background:rgba(0,0,0,.55)}

dialog input,dialog textarea{width:100%;padding:9px;font:inherit;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx)}
dialog textarea{height:180px;font-family:ui-monospace,monospace;font-size:.8rem}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
</style>

<template data-id="calcolo-bmi" data-title="Calcolo BMI" data-desc="Indice di massa corporea e categoria." data-icon="🫀">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{font-family:system-ui,sans-serif;margin:0;padding:20px;color:#14181f;background:#fff}
label{display:block;margin:12px 0 4px;font-size:.9rem}input{width:100%;padding:8px;font-size:1rem;border:1px solid #ccd;border-radius:8px}
.out{margin-top:20px;font-size:1.4rem;font-weight:700;color:#0d9488}</style>
<label>Peso (kg)</label><input id="p" type="number" value="70">
<label>Altezza (cm)</label><input id="h" type="number" value="175">
<div class="out" id="o"></div>
<script>
function s(){var p=+document.getElementById('p').value,h=+document.getElementById('h').value/100;if(!p||!h){document.getElementById('o').textContent='';return}
var b=p/(h*h),c=b<18.5?'Sottopeso':b<25?'Normopeso':b<30?'Sovrappeso':'Obesità';
document.getElementById('o').textContent='BMI '+b.toFixed(1)+' – '+c}
document.querySelectorAll('input').forEach(function(i){i.oninput=s});s();
</script>
</template>

<script id="main">
(function(){
  var app=document.getElementById('app'),K='medsim_gh',P='medsim_pending';
  function el(t,a,x){var e=document.createElement(t);for(var k in (a||{}))e.setAttribute(k,a[k]);if(x!=null)e.textContent=x;return e}
  function cfg(){try{return JSON.parse(sessionStorage.getItem(K)||localStorage.getItem(K)||'null')}catch(e){return null}}
  function pend(){try{return JSON.parse(sessionStorage.getItem(P)||'{"add":[],"del":[]}')}catch(e){return{add:[],del:[]}}}
  function setPend(p){try{sessionStorage.setItem(P,JSON.stringify(p))}catch(e){}}
  function published(){return Array.prototype.map.call(document.querySelectorAll('template[data-id]'),function(t){return {id:t.dataset.id,title:t.dataset.title,desc:t.dataset.desc||'',icon:t.dataset.icon||'🧪',img:t.dataset.img||'',html:t.innerHTML}})}
  function all(){
    var pub=published(),ids=pub.map(function(x){return x.id}),p=pend();
    p.edit=p.edit||{};p.add=p.add.filter(function(a){return ids.indexOf(a.id)<0});p.del=p.del.filter(function(d){return ids.indexOf(d)>-1});for(var ek in p.edit){if(Date.now()-p.edit[ek].ts>600000||ids.indexOf(ek)<0)delete p.edit[ek]}setPend(p);
    var list=pub.filter(function(x){return !(cfg()&&p.del.indexOf(x.id)>-1)}).map(function(x){var e=cfg()&&p.edit[x.id];if(e){e.pending=true;return e}return x});
    if(cfg())p.add.forEach(function(a){a.pending=true;list.push(a)});
    return list;
  }
  function slug(t){var s=t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'sim',ids=all().map(function(x){return x.id}).concat(['gioco']),b=s,n=2;while(ids.indexOf(s)>-1)s=b+'-'+n++;return s}
  function esc(x){return String(x).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}

  function api(path,opt,accept){var c=cfg();opt=opt||{};opt.cache='no-store';opt.headers={Authorization:'Bearer '+c.token,Accept:accept||'application/vnd.github+json'};return fetch('https://api.github.com'+path,opt)}
  async function commit(mutate,msg){
    var c=cfg(),u='/repos/'+c.repo+'/contents/'+c.path,q='?ref='+encodeURIComponent(c.branch);
    var m=await api(u+q);if(!m.ok)throw new Error('Lettura file fallita ('+m.status+')');var sha=(await m.json()).sha;
    var r=await api(u+q,{},'application/vnd.github.raw+json');if(!r.ok)throw new Error('Lettura file fallita ('+r.status+')');
    var out=mutate(await r.text());
    var by=new TextEncoder().encode(out),bin='';for(var i=0;i<by.length;i+=32768)bin+=String.fromCharCode.apply(null,by.subarray(i,i+32768));
    var w=await api(u,{method:'PUT',body:JSON.stringify({message:msg,content:btoa(bin),sha:sha,branch:c.branch})});
    if(!w.ok){var e={};try{e=await w.json()}catch(x){}throw new Error(e.message||('Scrittura fallita ('+w.status+')'))}
  }

  var GC=(document.body.dataset.gc||'').trim(),lastView=null;
  function track(path,title){lastView=[path,title];if(!GC||cfg()||!window.goatcounter||!window.goatcounter.count)return;try{window.goatcounter.count({path:path,title:title})}catch(e){}}
  if(GC){var gs=document.createElement('script');gs.async=true;gs.src='https://gc.zgo.at/count.js';gs.setAttribute('data-goatcounter','https://'+GC+'.goatcounter.com/count');gs.setAttribute('data-goatcounter-settings','{"no_onload":true}');gs.onload=function(){if(lastView)track(lastView[0],lastView[1])};document.head.appendChild(gs)}
  document.getElementById('theme').onclick=function(){var r=document.documentElement,cur=r.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'),nx=cur==='dark'?'light':'dark';r.setAttribute('data-theme',nx);try{localStorage.setItem('medsim_theme',nx)}catch(e){}};
  function toast(m){var t=el('div',{class:'toast'},m);document.body.appendChild(t);setTimeout(function(){t.remove()},2200)}
  function share(sim){
    var url=stubOk[sim.id]?baseUrl()+'s/'+sim.id+'/':location.href.split('#')[0]+'#'+sim.id;
    if(navigator.share&&matchMedia('(pointer:coarse)').matches){navigator.share({title:sim.title+' · MedLab Sim',url:url}).catch(function(){});return}
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(url).then(function(){toast('Link copiato')},function(){prompt('Copia il link:',url)})}else prompt('Copia il link:',url);
  }

  var gcCache={},gcErr='';
  function gcGet(path,q){
    if(!GC)return Promise.resolve(null);
    var u='https://'+GC+'.goatcounter.com/counter/'+(path==='TOTAL'?'TOTAL':encodeURIComponent(path))+'.json'+(q||''),c=gcCache[u];
    if(c&&Date.now()-c.t<300000)return Promise.resolve(c.v);
    return fetch(u).then(function(r){if(!r.ok){gcErr='errore '+r.status;throw 0}return r.json()}).then(function(j){var v=j.count!=null?j.count:null;gcCache[u]={t:Date.now(),v:v};return v}).catch(function(e){if(e)gcErr='richiesta bloccata ('+(e.message||e)+')';return null});
  }
  function statsPanel(){
    var sp=el('div',{class:'stats'}),d=new Date(),td=d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2),got=0,n=0,chips=[];
    [['Totale',''],['Oggi','?start='+td],['Ultimi 7 giorni','?start=week']].forEach(function(x){
      var c=el('span',{class:'chip'},'📊 '+x[0]+': …');sp.appendChild(c);chips.push(c);
      gcGet('TOTAL',x[1]).then(function(v){n++;if(v!=null){got++;c.textContent='📊 '+x[0]+': '+v}else c.textContent='📊 '+x[0]+': –';
        if(n===3&&!got)sp.appendChild(el('span',{class:'chip'},'Statistiche non disponibili'+(gcErr?' – '+gcErr:'')+'. Prova senza blocco pubblicità/tracker.'))});
    });
    var a=el('a',{href:'https://'+GC+'.goatcounter.com',target:'_blank',rel:'noopener'},'Apri dashboard ↗');sp.appendChild(a);
    return sp;
  }

  function fitFs(){var w=document.querySelector('.simwrap.fs'),v=window.visualViewport;if(!w||!v||v.scale>1.01)return;w.style.top=v.offsetTop+'px';w.style.left=v.offsetLeft+'px';w.style.width=v.width+'px';w.style.height=v.height+'px';w.style.right='auto';w.style.bottom='auto'}
  if(window.visualViewport){visualViewport.addEventListener('resize',fitFs);visualViewport.addEventListener('scroll',fitFs)}
  function enterFs(w){w.classList.add('fs');document.body.style.overflow='hidden';fitFs();try{var r=w.requestFullscreen&&w.requestFullscreen();if(r&&r.catch)r.catch(function(){})}catch(e){}}
  function exitFs(w){if(w){w.classList.remove('fs');w.style.cssText='';var fr=w.querySelector('iframe');if(fr)fr.style.cssText=''}document.body.style.overflow='';try{if(document.fullscreenElement){var r=document.exitFullscreen();if(r&&r.catch)r.catch(function(){})}}catch(e){}}
  function exitAll(){exitFs(document.querySelector('.simwrap.fs'))}
  document.addEventListener('fullscreenchange',function(){if(!document.fullscreenElement)exitAll()});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')exitAll()});

  var gameTimer;
  function renderGame(){
    document.title='Acchiappa il cuore · MedLab Sim';
    var bar=el('div',{class:'bar'});bar.appendChild(el('a',{class:'back',href:'#'},'← Tutti'));bar.appendChild(el('h2',null,'🫀 Acchiappa il cuore'));app.appendChild(bar);
    var st=el('div',{class:'gstats'}),sc=el('span',null,'Punti: 0'),tm=el('span',null,'Tempo: 15s'),bs=el('span',null,''),go=el('button',{class:'b p'},'▶ Gioca'),msg=el('p',{class:'gmsg'},'Tocca il cuore più veloce che puoi: hai 15 secondi.'),board=el('div',{class:'gboard'});
    [sc,tm,bs,go].forEach(function(x){st.appendChild(x)});app.appendChild(st);app.appendChild(msg);app.appendChild(board);
    var cells=[],score=0,cur=-1,run=false;
    for(var k=0;k<9;k++){(function(i){var c=el('button',{class:'gcell','aria-label':'Casella'});c.onpointerdown=function(e){e.preventDefault();hit(i)};cells.push(c);board.appendChild(c)})(k)}
    function best(){try{return +localStorage.getItem('medsim_best_tap')||0}catch(e){return 0}}
    function showBest(){var b=best();bs.textContent=b?'Record: '+b:''}
    function clearCur(){if(cur>=0){cells[cur].textContent='';cells[cur].classList.remove('on')}}
    function place(){var n;do{n=Math.floor(Math.random()*9)}while(n===cur);clearCur();cur=n;cells[n].textContent='🫀';cells[n].classList.add('on')}
    function hit(i){if(!run||i!==cur)return;score++;sc.textContent='Punti: '+score;place()}
    function finish(){
      run=false;clearInterval(gameTimer);clearCur();cur=-1;tm.textContent='Tempo: 0s';
      var rec=score>best();if(rec){try{localStorage.setItem('medsim_best_tap',score)}catch(e){}}
      showBest();msg.textContent='Fine! '+score+' punti'+(rec&&score>0?' – nuovo record!':'');go.textContent='↻ Rigioca';go.disabled=false;
    }
    function start(){
      score=0;cur=-1;run=true;sc.textContent='Punti: 0';msg.textContent='';go.disabled=true;place();
      var t=Date.now()+15000;tm.textContent='Tempo: 15s';
      gameTimer=setInterval(function(){var l=Math.ceil((t-Date.now())/1000);if(l<=0)finish();else tm.textContent='Tempo: '+l+'s'},150);
    }
    go.onclick=start;showBest();
  }

  function render(){
    var id=location.hash.slice(1),list=all(),sim=list.find(function(s){return s.id===id}),adm=!!cfg();
    app.textContent='';clearInterval(gameTimer);track('/'+id,sim?sim.title:id==='gioco'?'Minigioco':'Home');
    if(id==='gioco'){renderGame();window.scrollTo(0,0);return}
    if(sim){
      var bar=el('div',{class:'bar'});bar.appendChild(el('a',{class:'back',href:'#'},'← Tutti'));bar.appendChild(el('h2',null,sim.icon+' '+sim.title));var w=el('div',{class:'simwrap'}),fsb=el('button',{class:'b'},'⛶ Schermo intero'),shb=el('button',{class:'b',style:'margin-left:auto'},'🔗 Condividi');shb.onclick=function(){share(sim)};bar.appendChild(shb);bar.appendChild(fsb);app.appendChild(bar);
      var f=el('iframe',{title:sim.title,sandbox:'allow-scripts allow-forms allow-modals'});f.srcdoc='<!DOCTYPE html><html><head><meta charset="utf-8"></head><body>'+sim.html+'</body></html>';w.appendChild(f);var ctl=el('div',{class:'fsctl'}),z=1,zl=el('button',{class:'b',title:'Ripristina'},'100%'),zm=el('button',{class:'b','aria-label':'Rimpicciolisci'},'−'),zp=el('button',{class:'b','aria-label':'Ingrandisci'},'＋'),xb=el('button',{class:'b p'},'✕ Esci');
      function setZ(v){z=Math.max(.5,Math.min(2,Math.round(v*100)/100));zl.textContent=Math.round(z*100)+'%';if(w.classList.contains('fs')){f.style.width=(100/z)+'%';f.style.height=(100/z)+'%';f.style.transform='scale('+z+')';f.style.transformOrigin='0 0'}}
      zm.onclick=function(){setZ(z-.1)};zp.onclick=function(){setZ(z+.1)};zl.onclick=function(){setZ(1)};xb.onclick=function(){exitFs(w)};
      [zm,zl,zp,xb].forEach(function(x){ctl.appendChild(x)});w.appendChild(ctl);app.appendChild(w);fsb.onclick=function(){setZ(1);enterFs(w);setZ(1)};
      document.title=sim.title+' · MedLab Sim';
      try{fetch(baseUrl()+'s/'+sim.id+'/',{method:'HEAD',cache:'no-store'}).then(function(r){stubOk[sim.id]=r.ok}).catch(function(){})}catch(e){}
    }else{
      document.title='MedLab Sim';
      app.appendChild(el('div',{class:'eyebrow'},'🩺 Simulatori medici'));var h1=el('h1',{style:'user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent'},'MedLab Sim'),tp=0,tt;h1.onclick=function(){tp++;clearTimeout(tt);tt=setTimeout(function(){tp=0},2000);if(tp>=3){tp=0;location.hash='gioco'}};app.appendChild(h1);
      app.appendChild(el('p',{class:'sub'},'Simulatori per la medicina: scegli un caso da provare.'));
      app.appendChild(el('p',{class:'notice'},'Strumenti per l\'esercitazione: i simulatori non sono perfetti e possono contenere errori.'));
      if(adm){
        var ad=el('div',{class:'adm'});
        [['＋ Aggiungi simulatore','p',openAdd],['🔗 Anteprime link','',genStubs],['Esci','',logout]].forEach(function(x){var b=el('button',{class:'b '+x[1]},x[0]);b.onclick=x[2];ad.appendChild(b)});
        app.appendChild(ad);if(GC)app.appendChild(statsPanel());
      }
      var g=el('div',{class:'grid'});
      list.forEach(function(s){
        var a=el('a',{class:'card',href:'#'+s.id});
        if(s.img){var th=el('div',{class:'thumb'}),im=el('img',{src:s.img,alt:'',loading:'lazy'});th.appendChild(im);a.appendChild(th)}else a.appendChild(el('div',{class:'ic'},s.icon));a.appendChild(el('h2',null,s.title));a.appendChild(el('p',null,s.desc));if(adm&&GC){var vw=el('span',{class:'views'},'👁 …');a.appendChild(vw);gcGet('/'+s.id).then(function(v){vw.textContent=v!=null?'👁 '+v+' visite':''})}
        if(s.pending)a.appendChild(el('span',{class:'tag'},'in pubblicazione'));
        if(adm){var d=el('button',{class:'del',title:'Elimina'},'✕');d.onclick=function(e){e.preventDefault();del(s)};a.appendChild(d);var ed=el('button',{class:'del edt',title:'Modifica'},'✎');ed.onclick=function(e){e.preventDefault();openAdd(s)};a.appendChild(ed)}
        g.appendChild(a);
      });
      app.appendChild(g);
    }
    window.scrollTo(0,0);
  }

  async function login(){
    var repo=prompt('Repository GitHub (formato utente/nome):',localStorage.getItem('medsim_repo')||'');if(!repo)return;
    var token=prompt('Token GitHub (fine-grained, permesso Contents: Read and write):');if(!token)return;
    try{
      var r=await fetch('https://api.github.com/repos/'+repo.trim(),{headers:{Authorization:'Bearer '+token.trim(),Accept:'application/vnd.github+json'}});
      var j=await r.json();
      if(!r.ok){alert('Accesso negato (errore '+r.status+'): '+(j.message||'')+'\n401 = token errato o scaduto.\n404 = nome del repository errato oppure token senza accesso a quel repository.');return}
      if(j.permissions&&j.permissions.push===false&&!confirm('GitHub indica che il token potrebbe non avere il permesso di scrittura. Continuare comunque?'))return;
      var c={repo:repo.trim(),token:token.trim(),branch:j.default_branch,path:'index.html'};
      localStorage.setItem('medsim_repo',c.repo);
      var keep=confirm('Ricordare l\'accesso su questo dispositivo?\nOK = sì (usa solo un dispositivo personale)\nAnnulla = solo per questa sessione');
      (keep?localStorage:sessionStorage).setItem(K,JSON.stringify(c));
      render();
    }catch(e){alert('Errore di connessione: '+e.message)}
  }
  function logout(){try{localStorage.removeItem(K);sessionStorage.removeItem(K)}catch(e){}render()}
  document.getElementById('lock').onclick=function(){cfg()?logout():login()};

  var stubOk={},SITE_DESC="Simulatori per l'esercitazione agli esami.";
  function baseUrl(){return location.origin+location.pathname.replace(/[^\/]*$/,'')}
  function b64(t){var by=new TextEncoder().encode(t),bin='';for(var i=0;i<by.length;i+=32768)bin+=String.fromCharCode.apply(null,by.subarray(i,i+32768));return btoa(bin)}
  async function fileSha(path){var c=cfg(),r=await api('/repos/'+c.repo+'/contents/'+path+'?ref='+encodeURIComponent(c.branch));if(r.status===404)return null;if(!r.ok)throw new Error('Lettura fallita ('+r.status+')');return (await r.json()).sha}
  async function putFile(path,text,msg){var c=cfg(),sha=await fileSha(path),body={message:msg,content:b64(text),branch:c.branch};if(sha)body.sha=sha;var w=await api('/repos/'+c.repo+'/contents/'+path,{method:'PUT',body:JSON.stringify(body)});if(!w.ok){var e={};try{e=await w.json()}catch(x){}throw new Error(e.message||('Scrittura fallita ('+w.status+')'))}}
  async function delFile(path,msg){var c=cfg(),sha=await fileSha(path);if(!sha)return;var w=await api('/repos/'+c.repo+'/contents/'+path,{method:'DELETE',body:JSON.stringify({message:msg,sha:sha,branch:c.branch})});if(!w.ok)throw new Error('Eliminazione fallita ('+w.status+')')}
  function stubHtml(x){
    var u=baseUrl()+'s/'+x.id+'/',t=esc(x.title+' · MedLab Sim'),d=esc(x.desc||SITE_DESC),h='../../#'+x.id;
    return '<!DOCTYPE html>\n<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">\n<title>'+t+'</title>\n<meta name="description" content="'+d+'">\n<meta property="og:title" content="'+t+'">\n<meta property="og:description" content="'+d+'">\n<meta property="og:type" content="website">\n<meta property="og:url" content="'+u+'">\n<meta name="twitter:card" content="summary">\n<meta name="twitter:title" content="'+t+'">\n<meta name="twitter:description" content="'+d+'">\n<meta http-equiv="refresh" content="0;url='+h+'">\n<script>location.replace("'+h+'")<\/script>\n</head><body><a href="'+h+'">Apri il simulatore</a></body></html>\n';
  }
  async function genStubs(){
    if(!confirm('Creare o aggiornare le pagine di anteprima per tutti i simulatori pubblicati?'))return;
    var list=all(),n=0;
    try{for(var i=0;i<list.length;i++){await putFile('s/'+list[i].id+'/index.html',stubHtml(list[i]),'Anteprima: '+list[i].title);n++}toast('Anteprime aggiornate: '+n)}
    catch(e){alert(e.message+' (completate: '+n+')')}
  }

  async function del(s){
    if(!confirm('Eliminare "'+s.title+'" dal sito pubblico?'))return;
    try{
      await commit(function(t){var n=t.replace(new RegExp('<template data-id="'+s.id+'"[\\s\\S]*?</template>\\s*'),'');if(n===t)throw new Error('Simulatore non trovato nel file');return n},'Rimosso simulatore: '+s.title);
      try{await delFile('s/'+s.id+'/index.html','Rimossa anteprima: '+s.title)}catch(e){}
      var p=pend();p.edit=p.edit||{};p.add=p.add.filter(function(a){return a.id!==s.id});delete p.edit[s.id];p.del.push(s.id);setPend(p);render();
    }catch(e){alert(e.message)}
  }

  function resizeImg(file){return new Promise(function(ok,ko){var r=new FileReader();r.onerror=ko;r.onload=function(){var im=new Image();im.onerror=ko;im.onload=function(){var k=Math.min(1,480/im.width),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.8))};im.src=r.result};r.readAsDataURL(file)})}
  function tplText(x){return '<template data-id="'+x.id+'" data-title="'+esc(x.title)+'" data-desc="'+esc(x.desc)+'" data-icon="'+esc(x.icon)+'"'+(x.img?' data-img="'+esc(x.img)+'"':'')+'>\n'+x.html+'\n</template>\n\n'}

  function openAdd(sim){
    if(!sim||typeof sim.title!=='string')sim=null;
    var d=el('dialog'),lab=sim?'Salva modifiche':'Pubblica';
    d.innerHTML='<h3 style="margin:0 0 8px">'+(sim?'Modifica simulatore':'Nuovo simulatore')+'</h3><label>Titolo</label><input id="n_t"><label>Descrizione breve</label><input id="n_d"><label>Icona (emoji)</label><input id="n_i" maxlength="4"><label>Immagine di anteprima (opzionale)</label><input id="n_g" type="file" accept="image/*">'+(sim&&sim.img?'<label style="display:flex;gap:8px;align-items:center"><input id="n_rm" type="checkbox" style="width:auto"> Rimuovi l\'immagine attuale</label>':'')+'<label>Carica file .html</label><input id="n_f" type="file" accept=".html,.htm"><label>…oppure incolla il codice HTML</label><textarea id="n_h"></textarea><div class="row"><button class="b" id="n_c">Annulla</button><button class="b p" id="n_s">'+lab+'</button></div>';
    document.body.appendChild(d);d.showModal();
    var $=function(i){return d.querySelector('#'+i)};
    $('n_t').value=sim?sim.title:'';$('n_d').value=sim?sim.desc:'';$('n_i').value=sim?sim.icon:'🧪';$('n_h').value=sim?sim.html:'';
    $('n_f').onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){$('n_h').value=r.result;if(!$('n_t').value)$('n_t').value=f.name.replace(/\.html?$/i,'')};r.readAsText(f)};
    $('n_c').onclick=function(){d.close();d.remove()};
    $('n_s').onclick=async function(){
      var t=$('n_t').value.trim(),h=$('n_h').value.trim();if(!t||!h){alert('Titolo e codice sono obbligatori');return}
      var b=this;b.disabled=true;b.textContent='Pubblicazione…';
      try{
        var img=sim?(sim.img||''):'',g=$('n_g').files[0];
        if(g)img=await resizeImg(g);else if($('n_rm')&&$('n_rm').checked)img='';
        var x={id:sim?sim.id:slug(t),title:t,desc:$('n_d').value.trim(),icon:$('n_i').value.trim()||'🧪',img:img,html:h,ts:Date.now()};
        await commit(function(txt){
          if(sim){var re=new RegExp('<template data-id="'+x.id+'"[\\s\\S]*?</template>\\n*');if(!re.test(txt))throw new Error('Simulatore non trovato nel file');return txt.replace(re,function(){return tplText(x)})}
          var k=txt.indexOf('<script id="main">');if(k<0)throw new Error('Struttura del file non riconosciuta');
          return txt.slice(0,k)+tplText(x)+txt.slice(k);
        },(sim?'Modificato':'Aggiunto')+' simulatore: '+t);
        try{await putFile('s/'+x.id+'/index.html',stubHtml(x),'Anteprima: '+t)}catch(e){}
        var p=pend();p.edit=p.edit||{};
        if(sim&&p.add.some(function(a){return a.id===x.id}))p.add=p.add.map(function(a){return a.id===x.id?x:a});
        else if(sim)p.edit[x.id]=x;else p.add.push(x);
        setPend(p);d.close();d.remove();render();
        alert('Pubblicato. Sarà online per tutti entro circa 1 minuto.');
      }catch(e){alert(e.message);b.disabled=false;b.textContent=lab}
    };
  }

  window.addEventListener('hashchange',render);render();
})();
</script>

const DEF=[
{t:1,q:"Parasitism",m:"A relationship between two organisms of different species in which the parasite lives on or in the host, feeds on it and harms it, depending on it metabolically."},
{t:1,q:"Parasite",m:"An organism that lives at the expense of another organism (the host), obtaining food and shelter from it and usually causing harm."},
{t:1,q:"Host",m:"The organism that harbors and nourishes the parasite."},
{t:1,q:"Obligate parasite",m:"A parasite that cannot complete its life cycle without a host."},
{t:1,q:"Facultative parasite",m:"A free-living organism that can occasionally live as a parasite in a host."},
{t:1,q:"Ectoparasite",m:"A parasite that lives on the body surface of the host (e.g. lice, ticks, fleas, Sarcoptes)."},
{t:1,q:"Endoparasite",m:"A parasite that lives inside the body of the host (e.g. intestinal worms, protozoa)."},
{t:1,q:"Temporary parasite",m:"A parasite that stays on the host only to feed (e.g. mosquito, flea, tick)."},
{t:1,q:"Adaptation of the parasite to the host",m:"Morphological and physiological changes that allow survival in the host: attachment organs (suckers, hooks), loss of the digestive system in tapeworms, high reproductive capacity, resistance to digestive enzymes, antigenic variation."},
{t:1,q:"Definitive host",m:"The host in which the parasite reaches sexual maturity and reproduces sexually."},
{t:1,q:"Intermediate host",m:"The host in which the parasite passes its larval or asexual stages."},
{t:2,q:"Reservoir host",m:"An animal that harbors the parasite in nature and is a source of infection for man (zoonosis)."},
{t:2,q:"Accidental host",m:"A host that is not a normal host of the parasite and usually is a dead end (e.g. man in Echinococcus granulosus)."},
{t:2,q:"Pathogenic form",m:"The stage of the parasite that causes the disease in the host (e.g. the trophozoite of Entamoeba histolytica)."},
{t:2,q:"Invasive form",m:"The infective stage of the parasite that enters the host and starts the infection (e.g. the cyst of Giardia)."},
{t:2,q:"Vector",m:"An arthropod that transmits the parasite from one host to another; biological if the parasite develops in it (Anopheles for Plasmodium), mechanical if it is carried passively (housefly)."},
{t:2,q:"Commensalism",m:"A relationship in which one organism benefits and the other is neither harmed nor helped (e.g. Entamoeba coli in the gut)."},
{t:2,q:"Mutualism",m:"A relationship in which both partners benefit."},
{t:2,q:"Zoonosis",m:"An infection or disease naturally transmitted between animals and man."},
{t:2,q:"Autoinfection",m:"Reinfection of the same host without leaving it, by its own parasites (e.g. Enterobius, Strongyloides)."},
{t:3,q:"Trophozoite",m:"The active, feeding and multiplying vegetative stage of protozoa; usually the pathogenic form."},
{t:3,q:"Cyst (protozoan)",m:"A resistant, dormant stage surrounded by a wall, usually the infective form transmitted by the fecal-oral route."},
{t:7,q:"Hypnozoite",m:"A dormant liver stage of Plasmodium vivax and P. ovale that causes relapses months or years later."},
{t:7,q:"Schizogony",m:"Asexual multiplication by multiple fission of the schizont into merozoites (in hepatocytes and red blood cells)."},
{t:7,q:"Gametocyte",m:"The sexual form of Plasmodium in red blood cells, infective for Anopheles."},
{t:10,q:"Metacercaria",m:"The encysted larval stage of trematodes, infective for the definitive host."},
{t:10,q:"Miracidium",m:"The ciliated free-swimming larva that hatches from the trematode egg and infects the snail."},
{t:11,q:"Cercaria",m:"The free-swimming, fork-tailed larva that leaves the snail; in Schistosoma it penetrates human skin."},
{t:12,q:"Proglottid",m:"One segment of the tapeworm strobila containing male and female reproductive organs."},
{t:12,q:"Scolex",m:"The head of a tapeworm, with suckers or grooves (and hooks) for attachment."},
{t:13,q:"Cysticercus",m:"The bladder-like larval stage of Taenia with an invaginated scolex, found in the muscle of the intermediate host."},
{t:14,q:"Hydatid cyst",m:"The larval stage of Echinococcus granulosus: a fluid-filled cyst with a laminated wall producing protoscolices (hydatid sand), mostly in liver and lungs."},
{t:16,q:"Microfilaria",m:"The larva produced by adult filarial worms (e.g. Wuchereria bancrofti), found in blood and taken up by the mosquito."},
{t:16,q:"Filariform larva",m:"The infective L3 larva of Strongyloides and hookworms, able to penetrate the skin."},
{t:17,q:"Ticks (Ixodidae)",m:"Blood-sucking arachnids of the order Acarina with 4 pairs of legs in the adult and a capitulum with hypostome; life cycle egg, larva, nymph, adult; vectors of Lyme disease (Borrelia), tick-borne encephalitis and rickettsiae."},
{t:18,q:"Nit",m:"The egg of a louse, glued to the hair shaft."},
{t:19,q:"Fleas (Aphaniptera)",m:"Wingless, laterally flattened jumping insects with complete metamorphosis (egg, larva, pupa, adult); Xenopsylla cheopis transmits plague (Yersinia pestis) and murine typhus."},
{t:20,q:"Anopheles",m:"A mosquito genus; only the female bites and is the definitive host and vector of Plasmodium (malaria); resting with the body at an angle to the surface."},
{t:20,q:"Culex",m:"A mosquito genus; the vector of Wuchereria bancrofti (lymphatic filariasis) and of arboviruses such as West Nile virus; rests with the body parallel to the surface."},
{t:20,q:"Phlebotomus papatasii",m:"A small hairy sandfly, vector of Leishmania and of sandfly (pappataci) fever."},
{t:21,q:"Glossina palpalis",m:"The tsetse fly (family Muscidae), a blood-sucking fly of Africa that biologically transmits Trypanosoma gambiense (sleeping sickness); both sexes bite."}

const CASES=[{"n": "Plasmodium spp.", "y": 2005, "c": 147, "m": "January", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2005/case147.html", "p": "A 75-year-old man had gastrointestinal bleeding in Nigeria and received 8 units of whole blood reportedly imported from India. Two months after returning to the United States, he developed a fever of 101 degrees and chills. Blood smears were sent to a laboratory, which identified one […] species and requested help checking for a possible second species.", "d": "The […] gametocyte shows a faint outline of the infected red blood cell, called Laveran's bib. The […] gametocyte shows scattered brown pigment and an infected cell about .75% the size of nearby uninfected red blood cells, and the […] show basket forms.", "f": "The P. falciparum gametocyte shows a faint outline of the infected red blood cell, called Laveran's bib. The P. malariae gametocyte shows scattered brown pigment and an infected cell about .75% the size of nearby uninfected red blood cells, and the P. malariae trophozoites show basket forms.", "z": "Mixed malaria infection", "s": "Blood smear, Wright's-Giemsa stained thin smear", "g": 0}, {"n": "Enterobius vermicularis", "y": 2005, "c": 151, "m": "March", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2005/case151.html", "p": "A 39-year-old female had a descending colon biopsy to determine the cause of chronic abdominal pain and discomfort. No pertinent travel history was known. Worm-like objects were detected during the biopsy, and some were recovered. The specimens were sent to the South Carolina state health department laboratory for identification.", "d": "The worm had cephalic inflations on its anterior end and no spicules in the tail, indicating a female, whose tail is long, tapered, and slender. Eggs in the exposed uterus confirmed the female identification. The eggs measured 50-60 by 20-32 and were oval with one side flattened.", "f": "The worm had cephalic inflations on its anterior end and no spicules in the tail, indicating a female, whose tail is long, tapered, and slender. Eggs in the exposed uterus confirmed the female identification. The eggs measured 50-60 by 20-32 and were oval with one side flattened.", "z": "Enterobiasis (pinworm)", "s": "Descending colon biopsy; worm-like objects recovered from the biopsy, with eggs teased out for imaging.", "g": 0}, {"n": "Plasmodium spp.", "y": 2005, "c": 153, "m": "April", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2005/case153.html", "p": "A 32-year-old man from Nigeria, visiting relatives in the United States for about a week, went to a local emergency room with headaches, nausea, and general weakness and fatigue. A fingerstick blood sample was taken, and thick and thin blood films were prepared. Images of the thick films were sent to CDC for confirmation.", "d": "The thick film showed many thin, delicate ring forms with a red chromatin dot and blue cytoplasm, and no stages other than rings, which suggests […]. A few late rings or early […] had traces of yellowish-brown pigment, which ruled out babesiosis.", "f": "The thick film showed many thin, delicate ring forms with a red chromatin dot and blue cytoplasm, and no stages other than rings, which suggests P. falciparum. A few late rings or early trophozoites had traces of yellowish-brown pigment, which ruled out babesiosis.", "z": "Malaria", "s": "Fingerstick blood, with Giemsa-stained thick and thin blood films.", "g": 0}, {"n": "Taenia solium", "y": 2005, "c": 154, "m": "April", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2005/case154.html", "p": "A 49-year-old male immigrant from Mexico was seen at a local medical facility specializing in neural disorders for frequent headaches and occasional seizures. Lesions were detected in the right frontal lobe of his brain.", "d": "A single protoscolex was visible within the bladder wall, and the spiral canal and one sucker of the protoscolex showed extensive folding. Calcareous corpuscles were also present.", "f": "A single protoscolex was visible within the bladder wall, and the spiral canal and one sucker of the protoscolex showed extensive folding. Calcareous corpuscles were also present.", "z": "Cysticercosis", "s": "Brain lesion tissue from the right frontal lobe, examined as a hematoxylin and eosin (H&E) stained section.", "g": 0}, {"n": "Plasmodium spp.", "y": 2005, "c": 157, "m": "June", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2005/case157.html", "p": "A 25-year-old woman presented to the emergency room with intermittent fever, nausea, and headaches, and a temperature of 104 degrees. She had worked and traveled in West Africa for the previous five months. She had taken […] drugs while abroad but stopped prophylaxis after returning to the United States. The attending physician ordered a blood smear, which was stained with Wright-Giemsa and examined.", "d": "Thin, delicate rings and a late ring or early trophozoite were seen, along with rounded gametocytes and typical crescent- or banana-shaped gametocytes with centrally located pigment. Some gametocytes were observed undergoing exflagellation.", "f": "Thin, delicate rings and a late ring or early trophozoite were seen, along with rounded gametocytes and typical crescent- or banana-shaped gametocytes with centrally located pigment. Some gametocytes were observed undergoing exflagellation.", "z": "Malaria", "s": "Thin blood smear, Wright-Giemsa stained, examined at 1000x magnification. PCR on residual blood sent to CDC identified only P. falciparum.", "g": 0}, {"n": "Entamoeba histolytica", "y": 2005, "c": 158, "m": "June", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2005/case158.html", "p": "A 42-year-old man had 2 weeks of diarrhea after an overseas assignment that took him through Southeast Asia and the Indian subcontinent. His symptoms began shortly before he returned to the United States. His physician ordered an ova and parasites (O&P) examination.", "d": "The organisms measured 20-25 micrometers, within the size range for […] . The nuclei had evenly distributed peripheral chromatin and a small, centrally located karyosome, and the cytoplasm was fine and granular, with a pseudopod present. One trophozoite had ingested red blood cells (erythrophagocytosis), which distinguishes […] from […].", "f": "The organisms measured 20-25 micrometers, within the size range for E. histolytica/E. dispar trophozoites. The nuclei had evenly distributed peripheral chromatin and a small, centrally located karyosome, and the cytoplasm was fine and granular, with a pseudopod present. One trophozoite had ingested red blood cells (erythrophagocytosis), which distinguishes E. histolytica from E. dispar.", "z": "Amebiasis", "s": "Fecal specimen; O&P examination using a Lugol's iodine wet mount and a trichrome-stained fecal smear", "g": 0}, {"n": "Pediculus capitis", "y": 2005, "c": 162, "m": "August", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2005/case162.html", "p": "A 6-year-old girl complained that her head was itchy after returning from a 4-week summer camp in the southeastern United States. Her doctor examined her and observed small, whitish objects near the base of the hair shafts on her scalp. The physician collected a few hairs for microscopic examination.", "d": "Eggs ([…]) were attached to the hair shafts, in a location consistent with head […]. Wingless insects with one pair of eyes, a pair of antennae, and six legs were present; six legs and antennae rule out ticks and […].", "f": "Eggs (nits) were attached to the hair shafts, in a location consistent with head lice. Wingless insects with one pair of eyes, a pair of antennae, and six legs were present; six legs and antennae rule out ticks and mites.", "z": "Pediculosis (head lice)", "s": "Hairs collected from the scalp, examined under the microscope", "g": 1}, {"n": "Plasmodium spp.", "y": 2005, "c": 165, "m": "October", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2005/case165.html", "p": "A woman went to a local emergency room with fevers and chills. She had recently traveled abroad to Burma and Thailand for three weeks. She had taken […] prophylaxis from a travel clinic on a previous trip but had not returned to the clinic before this one. A blood film was ordered.", "d": "Parasitized red blood cells are enlarged (greater than 1.5x), and the parasites include a large gametocyte with scattered pigment and amoeboid […], some very distorted. […] is excluded because its parasitized red blood cells do not enlarge, and Schuffner's stippling was not visible due to the stain used.", "f": "Parasitized red blood cells are enlarged (greater than 1.5x), and the parasites include a large gametocyte with scattered pigment and amoeboid trophozoites, some very distorted. P. malariae is excluded because its parasitized red blood cells do not enlarge, and Schuffner's stippling was not visible due to the stain used.", "z": "Malaria", "s": "Thick and thin blood smears, stained with ENG Scientific Malarial Quick Stain", "g": 0}, {"n": "Wuchereria bancrofti", "y": 2005, "c": 168, "m": "November", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2005/case168.html", "p": "In April 2005, the Oregon State Public Health Laboratory requested assistance through DPDx telediagnosis, submitting images of a thick and thin blood smear. The specimen information indicated the smears were most likely stained with Giemsa. The only case history available was that the patient lived in Africa until the beginning of this year. On the thin smear, the object measured 300 micrometers.", "d": "The organism has a partially visible sheath, which usually stains poorly with Giemsa. Its tail nuclei are evenly dispersed and end before the tip, which distinguishes it from Loa loa, whose tail nuclei extend to the tip. Its size of 240 to 300 micrometers in stained blood films is also within the range for […].", "f": "The organism has a partially visible sheath, which usually stains poorly with Giemsa. Its tail nuclei are evenly dispersed and end before the tip, which distinguishes it from Loa loa, whose tail nuclei extend to the tip. Its size of 240 to 300 micrometers in stained blood films is also within the range for W. bancrofti.", "z": "Bancroft's filariasis (lymphatic filariasis)", "s": "Thick and thin blood smears, Giemsa-stained", "g": 0}, {"n": "Trichinella spiralis", "y": 2005, "c": 170, "m": "December", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2005/case170.html", "p": "A lab worker found an unlabeled box of 20 pathology slides that appeared to be stained with H&E. One slide, shown at 200x magnification, was examined to identify its contents. The page gives no age, sex, origin, symptoms, or clinical history.", "d": "The object was an encapsulated nematode larva of the genus […]. The answer cautions that species should not be determined from this specimen alone, and that geographic, biologic, and clinical information should be considered.", "f": "The object was an encapsulated nematode larva of the genus Trichinella. The answer cautions that species should not be determined from this specimen alone, and that geographic, biologic, and clinical information should be considered.", "z": "Trichinellosis", "s": "H&E-stained pathology tissue slides, examined by light microscopy at 200x", "g": 0}, {"n": "Plasmodium spp.", "y": 2006, "c": 171, "m": "January", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2006/case171.html", "p": "A patient who had traveled to Honduras had a thin blood smear submitted to DPDx for telediagnosis by the Medical College of Wisconsin. The patient later developed fevers, chills, night sweats, and malaise, beginning several weeks after returning from vacation. […] prophylaxis was taken before and during the trip but stopped after return to the United States.", "d": "Ring forms appeared sturdy, and developing […] were amoeboid. Schüffner's dots were present, and a schizont in an enlarged red blood cell contained more than fifteen merozoites.", "f": "Ring forms appeared sturdy, and developing trophozoites were amoeboid. Schüffner's dots were present, and a schizont in an enlarged red blood cell contained more than fifteen merozoites.", "z": "Malaria", "s": "Thin blood smear", "g": 0}, {"n": "Diphyllobothrium latum", "y": 2006, "c": 172, "m": "January", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2006/case172.html", "p": "A 45-year-old female noticed a long, worm-like object in her stool. The object was collected and, along with tissue sections prepared by the hospital where she was seen, submitted to the Florida public health laboratory. The specimens were forwarded to CDC's parasitology diagnostic reference laboratory for identification.", "d": "Proglottids were broader than they were long, with centrally located genital pores and rosette-shaped uteri. These features ruled out […] sp., whose operculated eggs fell outside the size range of […] spp.", "f": "Proglottids were broader than they were long, with centrally located genital pores and rosette-shaped uteri. These features ruled out Taenia sp., whose operculated eggs fell outside the size range of Diphyllobothrium spp.", "z": "Diphyllobothriasis", "s": "Whole worm examined morphologically; a portion cleared in lacto-phenol, flattened between glass slides, and examined under a dissecting microscope; proglottid ruptured to release eggs for compound microscopy. DNA from proglottids was amplified by PCR (18S rRNA gene) and sequenced.", "g": 0}, {"n": "Plasmodium spp.", "y": 2006, "c": 173, "m": "February", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2006/case173.html", "p": "A 29-year-old female missionary had lived in Gabon and Cameroon for one year. Eight months into her stay, she visited a medical clinic with headache, fever, chills, and some diarrhea. She reported inconsistent adherence to her […] prophylaxis regimen. The physician ordered a blood film examination.", "d": "Fimbriated infected red blood cells are a diagnostic feature of […], and they must be distinguished from crenated cells, which are not diagnostic. Additional features include gametocytes in slightly enlarged, oval-shaped red blood cells, sturdy ring-form parasites, and an immature schizont in a slightly enlarged red blood cell.", "f": "Fimbriated infected red blood cells are a diagnostic feature of P. ovale, and they must be distinguished from crenated cells, which are not diagnostic. Additional features include gametocytes in slightly enlarged, oval-shaped red blood cells, sturdy ring-form parasites, and an immature schizont in a slightly enlarged red blood cell.", "z": "Malaria", "s": "Thick and thin blood films stained with Wright's stain.", "g": 0}, {"n": "Enterobius vermicularis", "y": 2006, "c": 174, "m": "February", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2006/case174.html", "p": "A teenage boy had surgery for a traumatic injury to his abdominal cavity. The surgeon also noticed necrosis around his appendix, and a biopsy of that area was sent to pathology. Hematoxylin and eosin (H&E) stained tissue sections were examined.", "d": "Sections of adult worms showed prominent lateral alae, a thin cuticle, and large, vacuolated lateral cords. Thick-shelled eggs that were flattened on one side were also seen.", "f": "Sections of adult worms showed prominent lateral alae, a thin cuticle, and large, vacuolated lateral cords. Thick-shelled eggs that were flattened on one side were also seen.", "z": "Enterobiasis (pinworm)", "s": "Tissue biopsy, H&E-stained section", "g": 0}, {"n": "Trichuris trichiura", "y": 2006, "c": 175, "m": "March", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2006/case175.html", "p": "An elderly patient had a colonoscopy for polyps. A worm was seen near the appendiceal orifice, and a biopsy was taken. The biopsy was fixed in formalin and sent to histology. Objects like the one in the figure measured approximately 50 µm in length.", "d": "The eggs were in utero and within the size range of […] (50 to 54 µm in length). They had polar plugs and the typical barrel shape.", "f": "The eggs were in utero and within the size range of T. trichiura (50 to 54 µm in length). They had polar plugs and the typical barrel shape.", "z": "Trichuriasis", "s": "Colonic biopsy, fixed in formalin, sectioned and stained with hematoxylin and eosin (H&E)", "g": 0}, {"n": "Trypanosoma cruzi", "y": 2006, "c": 176, "m": "March", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2006/case176.html", "p": "A CDC microbiologist reviewing archived slide boxes to assess slide quality found a pathology slide of heart tissue dated \"1929.\" The slide was stained with H&E. The case does not give the patient's age, sex, origin, or symptoms.", "d": "The objects are amastigotes, identified by a nucleus and a distinct, sometimes rod-shaped kinetoplast. Some amastigotes appear to be transforming into […]. Genus and species cannot be determined from amastigote morphology alone.", "f": "The objects are amastigotes, identified by a nucleus and a distinct, sometimes rod-shaped kinetoplast. Some amastigotes appear to be transforming into trypomastigotes. Genus and species cannot be determined from amastigote morphology alone.", "z": "American trypanosomiasis (Chagas disease)", "s": "Archived heart tissue pathology slide, H&E-stained", "g": 0}, {"n": "Balantidium coli", "y": 2006, "c": 179, "m": "May", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2006/case179.html", "p": "A group of refugees from Southeast Asia was screened for parasites as part of a medical evaluation. Stool specimens were collected and processed. Examination of a wet mount from a formalin-ethyl acetate (FEA) concentration of one individual's specimen showed an object seen in low numbers, approximately 75 µm in length.", "d": "The organism is identified by the presence of cilia, an oval shape with a somewhat tapered anterior end, and a large, round contractile vacuole. Without visible cilia, it could be mistaken for an artifact or a helminth egg.", "f": "The organism is identified by the presence of cilia, an oval shape with a somewhat tapered anterior end, and a large, round contractile vacuole. Without visible cilia, it could be mistaken for an artifact or a helminth egg.", "z": "Balantidiasis", "s": "Stool; FEA concentration, examined as a wet mount", "g": 0}, {"n": "Plasmodium spp.", "y": 2006, "c": 190, "m": "October", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2006/case190.html", "p": "A patient with a travel history to India had thick blood smears stained with Wright-Giemsa, along with thin smears. The DPDx Team received a telediagnosis request asking for confirmation of an identification made by the Wisconsin State Laboratory of Hygiene. Age and sex are not stated.", "d": "Diagnostic features included sturdy rings, an amoeboid trophozoite, and a large gametocyte that almost fills the red blood cell, which is enlarged 1 1/2x. Free merozoites following schizont rupture were also seen, and Schüffner's dots may not always be demonstrated, depending on the stain type and pH.", "f": "Diagnostic features included sturdy rings, an amoeboid trophozoite, and a large gametocyte that almost fills the red blood cell, which is enlarged 1 1/2x. Free merozoites following schizont rupture were also seen, and Schüffner's dots may not always be demonstrated, depending on the stain type and pH.", "z": "Malaria", "s": "Thick and thin blood smears, stained with Wright-Giemsa", "g": 0}, {"n": "Entamoeba histolytica", "y": 2006, "c": 192, "m": "November", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2006/case192.html", "p": "A patient with a travel history to Sri Lanka had a liver abscess found during autopsy. A request for confirmation of an identification was submitted to DPDx Telediagnosis Assistance. The page does not state the patient's age, sex, or symptoms.", "d": "Trophozoite nuclei are smaller than those of macrophages in the same field, with a nuclear ratio of about 1:10 to 1:12 rather than the 1:4 to 1:6 typical of macrophages. A distinct central karyosome is visible, and the organisms' location in liver tissue rules out the morphologically similar […].", "f": "Trophozoite nuclei are smaller than those of macrophages in the same field, with a nuclear ratio of about 1:10 to 1:12 rather than the 1:4 to 1:6 typical of macrophages. A distinct central karyosome is visible, and the organisms' location in liver tissue rules out the morphologically similar E. dispar.", "z": "Invasive extraintestinal amebiasis", "s": "Liver abscess tissue from autopsy, examined as an H&E-stained histological section", "g": 0}, {"n": "Plasmodium spp.", "y": 2007, "c": 217, "m": "December", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2007/case217.html", "p": "A 29-year-old man with a history of travel to Rwanda was seen at a local health clinic with fever, headache, mild nausea, and chills.", "d": "Ring-stage forms appear within normal-sized red blood cells, and the […] look more mature, with thickened cytoplasm and an accole (applique) arrangement of two parasites. Maurer's clefts, which appear as spots or blotches of varying sizes, are present in the infected cells and should not be confused with the smaller, finer, more uniform Schuffner's dots.", "f": "Ring-stage forms appear within normal-sized red blood cells, and the trophozoites look more mature, with thickened cytoplasm and an accole (applique) arrangement of two parasites. Maurer's clefts, which appear as spots or blotches of varying sizes, are present in the infected cells and should not be confused with the smaller, finer, more uniform Schuffner's dots.", "z": "Malaria", "s": "Thin blood smear, stained with Giemsa and examined at 1000x magnification.", "g": 0}, {"n": "Enterobius vermicularis", "y": 2007, "c": 213, "m": "October", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2007/case213.html", "p": "A 49-year-old man with no known travel history had a colonoscopy. His physician saw small worms, 3 to 4 mm in length, during the procedure. The worms were sent to a pathology laboratory, where they were sectioned and stained. The presumed diagnosis, based on size and morphologic features, was sent to DPDx with the images. When asked, the submitter reported that the oval structures were approximately 50-55 micrometers in length.", "d": "The worm showed prominent lateral alae. The oval eggs were flattened on one side, and their size was consistent with […] eggs.", "f": "The worm showed prominent lateral alae. The oval eggs were flattened on one side, and their size was consistent with pinworm eggs.", "z": "Enterobiasis (pinworm)", "s": "Worms recovered during colonoscopy, sectioned and stained with hematoxylin and eosin (H&E).", "g": 0}, {"n": "Plasmodium spp.", "y": 2007, "c": 211, "m": "September", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2007/case211.html", "p": "A 10-year-old boy from India was tested for […] by blood smear examination. A commercial laboratory reviewed the smears and sent them, with EDTA blood, to a state health department for consultation. The state reported that the patient had been treated before the blood was drawn.", "d": "Structures that resembled […] gametocytes were identified as ookinetes. They were too large to be […] gametocytes, and their pigment was distributed toward the distal ends rather than centered as in […] gametocytes.", "f": "Structures that resembled P. falciparum gametocytes were identified as ookinetes. They were too large to be P. falciparum gametocytes, and their pigment was distributed toward the distal ends rather than centered as in P. falciparum gametocytes.", "z": "Malaria", "s": "Stained thick and thin blood smears, and EDTA blood (PCR analysis of an aliquot)", "g": 0}, {"n": "Plasmodium spp.", "y": 2007, "c": 209, "m": "August", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2007/case209.html", "p": "A 54-year-old Haitian man was admitted to a hospital emergency room with back pain and fever. Blood was collected, and slides were made and stained with Giemsa. Images were viewed at 1000x magnification using oil immersion.", "d": "Infected red blood cells were not enlarged, even when multiply infected. The rings were mostly thin and delicate, some with double chromatin dots, and no other parasite stages were seen. These features suggest […], especially at low parasitemia, though they are not exclusive to this species.", "f": "Infected red blood cells were not enlarged, even when multiply infected. The rings were mostly thin and delicate, some with double chromatin dots, and no other parasite stages were seen. These features suggest P. falciparum, especially at low parasitemia, though they are not exclusive to this species.", "z": "Malaria", "s": "Blood smear, stained with Giemsa", "g": 0}, {"n": "Schistosoma haematobium", "y": 2007, "c": 208, "m": "July", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2007/case208.html", "p": "A 29-year-old Peace Corps volunteer returned to the United States from Malawi with mild abdominal cramping and intermittent blood in his urine. His physician ordered tests, including ova and parasite examinations of stool and urine. A wet mount of urine sediment showed an object about 150 micrometers long.", "d": "The egg's size and terminal spine were consistent with […]. A miracidium was present within the egg.", "f": "The egg's size and terminal spine were consistent with S. haematobium. A miracidium was present within the egg.", "z": "Urinary schistosomiasis", "s": "Urine sediment, wet mount", "g": 0}, {"n": "Wuchereria bancrofti", "y": 2007, "c": 206, "m": "June", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2007/case206.html", "p": "A West African immigrant who had lived in Liberia and Sierra Leone was admitted to a medical center with shortness of breath, and pulmonary tuberculosis was suspected. An x-ray was ordered, an acid-fast bacillus smear was made, and blood was collected for platelet and hemoglobin measurements. A Wright-Giemsa-stained thin blood smear was reviewed, showing organisms approximately 250 um long, estimated from the relative size of the white blood cells.", "d": "The organism's size (244-296 um) was consistent with […]. Diagnostic features included a sheath, an anucleate tail (nuclei did not extend to the pointed tip), and a relatively short cephalic space.", "f": "The organism's size (244-296 um) was consistent with W. bancrofti. Diagnostic features included a sheath, an anucleate tail (nuclei did not extend to the pointed tip), and a relatively short cephalic space.", "z": "Bancroft's filariasis (lymphatic filariasis)", "s": "Thin blood smear, Wright-Giemsa stain", "g": 0}, {"n": "Plasmodium spp.", "y": 2007, "c": 205, "m": "June", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2007/case205.html", "p": "A 30-year-old man from Sudan had fever and chills and was mildly jaundiced. His physician ordered a blood smear examination.", "d": "Amoeboid […] were seen. Infected red blood cells were enlarged about 1.5x, with a hint of Schuffner's stippling in one, and there was a slightly enlarged gametocyte and a schizont with about 15 to 16 merozoites. Microgametes from exflagellation of male gametocytes, which can occur if blood sits at room temperature before smears are made, should not be mistaken for […], which are broader and have a nucleus and a kinetoplast.", "f": "Amoeboid trophozoites were seen. Infected red blood cells were enlarged about 1.5x, with a hint of Schuffner's stippling in one, and there was a slightly enlarged gametocyte and a schizont with about 15 to 16 merozoites. Microgametes from exflagellation of male gametocytes, which can occur if blood sits at room temperature before smears are made, should not be mistaken for trypanosomes, which are broader and have a nucleus and a kinetoplast.", "z": "Malaria", "s": "Thin blood smears stained with Leishman's stain.", "g": 0}, {"n": "Plasmodium spp.", "y": 2007, "c": 202, "m": "April", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2007/case202.html", "p": "A patient was seen at a hospital in Rwanda with headache, fever, and chills.", "d": "Infected red blood cells were enlarged (about 1 1/4 to 1 1/2 times normal) and some were elongated and fimbriated, with Schuffner's dots present. Multiple […] stages were seen, including compact […] with sturdy cytoplasm, round to oval gametocytes that nearly filled the red cells, and immature schizonts.", "f": "Infected red blood cells were enlarged (about 1 1/4 to 1 1/2 times normal) and some were elongated and fimbriated, with Schuffner's dots present. Multiple Plasmodium stages were seen, including compact trophozoites with sturdy cytoplasm, round to oval gametocytes that nearly filled the red cells, and immature schizonts.", "z": "Malaria", "s": "Thin blood smear, stained with Giemsa and examined at 1000x magnification.", "g": 0}, {"n": "Trichinella spiralis", "y": 2007, "c": 199, "m": "March", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2007/case199.html", "p": "A huntsman killed a bear and prepared the meat by cutting it into roasts and steaks and grinding the trimmings. Later that day, he ate a rare burger made from the fresh meat. About two and a half to three weeks later, he developed fever, diarrhea, and muscle pain, but he did not seek medical attention for another six weeks. He had elevated eosinophilia, and several laboratory tests were ordered. Some of the bear meat was sent to the Division of Parasitic Diseases' reference diagnostic laboratory.", "d": "The larvae were encapsulated and coiled within the bear's muscle tissue, which is consistent with some […] spp. The patient's serum was also positive for […] by EIA.", "f": "The larvae were encapsulated and coiled within the bear's muscle tissue, which is consistent with some Trichinella spp. The patient's serum was also positive for Trichinella by EIA.", "z": "Trichinellosis", "s": "Bear meat. The meat was digested with 0.1% pepsin and 0.1% hydrochloric acid, and a muscle squash was made from the softened tissue.", "g": 1}, {"n": "Plasmodium spp.", "y": 2007, "c": 197, "m": "February", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2007/case197.html", "p": "A state health department sent a specimen to the CDC Division of Parasitic Diseases reference laboratory for confirmatory review. The only patient information provided was that the patient had traveled to Nigeria. The case involves a stained thin blood smear.", "d": "Parasites appeared as thin, delicate rings, some with double chromatin dots, and only ring-stage […] were present. The infected red blood cells were not enlarged, unlike the typical enlargement and distortion seen in […] infections.", "f": "Parasites appeared as thin, delicate rings, some with double chromatin dots, and only ring-stage trophozoites were present. The infected red blood cells were not enlarged, unlike the typical enlargement and distortion seen in P. ovale infections.", "z": "Malaria", "s": "Stained thin blood smear", "g": 0}, {"n": "Schistosoma mansoni", "y": 2007, "c": 196, "m": "January", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2007/case196.html", "p": "A male missionary who spent one year traveling to various countries in sub-Saharan Africa developed abdominal pain and occasional diarrhea after returning to the U.S. He reported swimming in various lakes while abroad. An ova and parasite (O&P) stool examination showed objects measuring 135 um.", "d": "A miracidium is visible within the egg. The egg is unoperculated and falls within the size range for […] (118-180 um in length), and its typically prominent lateral spine is visible in a different focal plane.", "f": "A miracidium is visible within the egg. The egg is unoperculated and falls within the size range for S. mansoni (118-180 um in length), and its typically prominent lateral spine is visible in a different focal plane.", "z": "Schistosomiasis", "s": "Stool; O&P stool examination (microscopy)", "g": 0}, {"n": "Strongyloides stercoralis", "y": 2008, "c": 226, "m": "April", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2008/case226.html", "p": "A 32-year-old Latin American man sought medical attention for persistent fever and cough. A sputum specimen was collected for testing, and smears were prepared and stained with Giemsa. Forms were observed in very low numbers on the smears, captured at 200x and 1000x oil magnification. The object measured approximately 490 micrometers in length.", "d": "The larva's length fell within the size range for the species, and its esophagus-to-intestine ratio was roughly 1:1. It also had the notched tail characteristic of filariform (infective third-stage) larvae of this species.", "f": "The larva's length fell within the size range for the species, and its esophagus-to-intestine ratio was roughly 1:1. It also had the notched tail characteristic of filariform (infective third-stage) larvae of this species.", "z": "Strongyloidiasis", "s": "Sputum, examined as Giemsa-stained smears.", "g": 0}, {"n": "Plasmodium spp.", "y": 2008, "c": 229, "m": "June", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2008/case229.html", "p": "Wright-Giemsa stained blood smears and EDTA blood were sent to the CDC from a Public Health Laboratory for confirmatory diagnosis. The patient was a 46-year-old woman, and no travel history was available.", "d": "Intraerythrocytic parasites were seen, and some contained pigment that appeared light, golden-yellow. Vacuoles and pleomorphic cytoplasm were also present, features that can suggest […].", "f": "Intraerythrocytic parasites were seen, and some contained pigment that appeared light, golden-yellow. Vacuoles and pleomorphic cytoplasm were also present, features that can suggest Babesia.", "z": "Malaria", "s": "Thick and thin Wright-Giemsa stained blood smears, plus EDTA blood for PCR analysis. The smears were later found not to have been made in a timely manner from the EDTA specimen.", "g": 0}, {"n": "Plasmodium spp.", "y": 2008, "c": 238, "m": "October", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2008/case238.html", "p": "A 45-year-old man from Kenya, visiting relatives in the New England area, had fever and headache and was taken to hospital.", "d": "White blood cells containing ingested pigment were seen in low numbers, suggesting […]; a follow-up smear showed rare ring-stage parasites.", "f": "White blood cells containing ingested pigment were seen in low numbers, suggesting Plasmodium; a follow-up smear showed rare ring-stage parasites.", "z": "Malaria", "s": "Giemsa-stained thin blood smear (thick and thin smears should be prepared and repeated over 36 hours if negative)", "g": 0}, {"n": "Sarcoptes scabiei", "y": 2009, "c": 244, "m": "January", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2009/case244.html", "p": "An 80-year-old resident of a long-term care facility presented with thick crusts over the skin and slight itching. The patient was first treated for impetigo without resolution and was then admitted to the hospital for further testing.", "d": "Adult […] with cuticular spines and eggs were seen within burrows in the skin sections.", "f": "Adult mites with cuticular spines and eggs were seen within burrows in the skin sections.", "z": "Scabies", "s": "Skin biopsy, sectioned and stained with hematoxylin and eosin (H&E).", "g": 0}, {"n": "Plasmodium spp.", "y": 2009, "c": 245, "m": "February", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2009/case245.html", "p": "A 64-year-old man returned from a trip to Africa with fever and chills and went to a local hospital. A blood specimen was sent to Hematology for workup, including Parasitology, but only a Giemsa-stained thick blood smear was available for the pathologist to review.", "d": "Ring-form and developing […], some with double chromatin dots, were seen, along with white blood cells containing ingested pigment. Gametocytes and schizonts were absent, which supports […] when parasitemia is moderately high or greater.", "f": "Ring-form and developing trophozoites, some with double chromatin dots, were seen, along with white blood cells containing ingested pigment. Gametocytes and schizonts were absent, which supports P. falciparum when parasitemia is moderately high or greater.", "z": "Malaria", "s": "Thick blood smear stained with Giemsa", "g": 0}, {"n": "Trichuris trichiura", "y": 2009, "c": 248, "m": "March", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2009/case248.html", "p": "A 36-year-old male immigrant from Mozambique presented to his health care provider with heartburn and chronic right abdominal pain. All previous ova and parasite (O&P) examinations were negative. Endoscopy revealed a worm-like object in the ascending colon near the ileocecum. The object, about 7 mm long, was removed, fixed in 10% formalin, and sent to Pathology, where it was sectioned and stained with hematoxylin and eosin (H&E).", "d": "The worm has a long, slender anterior end and a shorter, thicker posterior end. Its thick, annulated cuticle, thin hypodermis with nuclei, polymyarian muscle cells, and thick-muscled cloaca are diagnostic, and the anterior section contains bacillary bands, a stichocyte, and stichosome nuclei.", "f": "The worm has a long, slender anterior end and a shorter, thicker posterior end. Its thick, annulated cuticle, thin hypodermis with nuclei, polymyarian muscle cells, and thick-muscled cloaca are diagnostic, and the anterior section contains bacillary bands, a stichocyte, and stichosome nuclei.", "z": "Trichuriasis", "s": "Worm removed by endoscopy from the ascending colon, formalin-fixed, sectioned, and H&E-stained.", "g": 0}, {"n": "Wuchereria bancrofti", "y": 2009, "c": 252, "m": "May", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2009/case252.html", "p": "A 29-year-old man from Haiti had blood drawn for routine work-up after hospitalization for complications of a congenital disorder. An object measuring 270 micrometers in length was seen on the blood smear.", "d": "The […] fell within the 240-300 micrometer size range for […] and had a loosely packed nuclear column. Its tail tapered to a point, with nuclei ending before the tail tip. Although the specimen was unsheathed, the size, nuclear structure, and travel history supported the diagnosis.", "f": "The microfilaria fell within the 240-300 micrometer size range for W. bancrofti and had a loosely packed nuclear column. Its tail tapered to a point, with nuclei ending before the tail tip. Although the specimen was unsheathed, the size, nuclear structure, and travel history supported the diagnosis.", "z": "Filariasis (lymphatic filariasis)", "s": "Giemsa-stained thick blood smear from blood collected in EDTA tubes", "g": 0}, {"n": "Ascaris lumbricoides", "y": 2009, "c": 253, "m": "June", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2009/case253.html", "p": "A 30-month-old child born in China was recently adopted by a family in the Netherlands. Three consecutive stool samples were collected for ova and parasite testing, as is standard during child adoption. The child had no complaints. Objects were seen in moderate numbers in the concentrate from each of the three samples. Most measured 73 to 85 micrometers long by 44 micrometers wide, and some measured 24 to 37 micrometers.", "d": "The smaller objects were a conglomerate of plant cells. The larger objects were infertile, decorticated […] eggs, which were smaller in length than the usual 85 to 95 micrometers.", "f": "The smaller objects were a conglomerate of plant cells. The larger objects were infertile, decorticated Ascaris eggs, which were smaller in length than the usual 85 to 95 micrometers.", "z": "Ascariasis", "s": "Stool; formalin-ethyl acetate concentration and water sedimentation, with wet mount examination of the concentrate.", "g": 0}, {"n": "Plasmodium spp.", "y": 2009, "c": 255, "m": "July", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2009/case255.html", "p": "A 36-year-old man was admitted to the hospital with fever, chills, headache, and myalgia. He had recently returned to the United States from a month-long trip to Rwanda to visit family. Blood was collected in EDTA and sent to the Hematology Department for work-up.", "d": "Infected RBCs were slightly enlarged. […] were elongated and fimbriated and showed Schuffner's stippling, and macrogametocytes filled the host RBC with coarse pigment, compact chromatin, and Schuffner's stippling.", "f": "Infected RBCs were slightly enlarged. Trophozoites were elongated and fimbriated and showed Schuffner's stippling, and macrogametocytes filled the host RBC with coarse pigment, compact chromatin, and Schuffner's stippling.", "z": "Malaria", "s": "Thin blood smear stained with Giemsa, drawn from EDTA-collected blood.", "g": 0}, {"n": "Entamoeba histolytica", "y": 2009, "c": 258, "m": "August", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2009/case258.html", "p": "A 23-year-old woman with no known travel history presented with a perianal ulcer. A biopsy was performed, and the specimen was preserved in formalin and sent to a pathology lab for work-up.", "d": "[…] in tissue have a single nucleus with peripheral chromatin and a central karyosome. […] also contain ingested red blood cells.", "f": "Trophozoites in tissue have a single nucleus with peripheral chromatin and a central karyosome. Trophozoites also contain ingested red blood cells.", "z": "Invasive amebiasis", "s": "Formalin-preserved tissue biopsy, sectioned and stained with hematoxylin and eosin (H&E), examined at 500x magnification.", "g": 0}, {"n": "Fasciola hepatica", "y": 2009, "c": 263, "m": "November", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2009/case263.html", "p": "A 35-year-old man from Nepal presented to a hospital with recurring cholangitis. He had experienced symptoms for six months. An MRI showed two liver lesions, each about 5 cm long and 2 cm wide, with both cystic and solid components. Endoscopic retrograde cholangiopancreatography (ERCP) of the common bile duct revealed flat, leaf-shaped objects. These were removed and preserved in 10% formalin. They averaged about 2 cm in length.", "d": "The worm has oral and ventral (acetabulum) suckers, along with branching ovaries and uterus. The uterus appears dark in carmine-stained specimens. The intestinal cecum is also extensively branched.", "f": "The worm has oral and ventral (acetabulum) suckers, along with branching ovaries and uterus. The uterus appears dark in carmine-stained specimens. The intestinal cecum is also extensively branched.", "z": "Fascioliasis", "s": "Bile duct specimen removed by ERCP, preserved in 10% formalin. One specimen was stained with carmine at a reference laboratory.", "g": 0}, {"n": "Plasmodium spp.", "y": 2009, "c": 266, "m": "December", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2009/case266.html", "p": "A 40-year-old man sought hospital care one week after returning from a mining operation in Ghana. He had diarrhea, vomiting, and night fevers. He likely had not taken […] prophylaxis, though this was not confirmed.", "d": "Thin, delicate ring forms in normal-sized RBCs and appliqué (accolade) forms were consistent with […], though not exclusive to it. Enlarged, oval, fimbriated infected RBCs with a large gametocyte and large, somewhat amoeboid […] were consistent with […]. Schuffner's stippling in some infected RBCs on the Giemsa-stained smear supported […]; it was absent from the […] rings.", "f": "Thin, delicate ring forms in normal-sized RBCs and appliqué (accolade) forms were consistent with P. falciparum, though not exclusive to it. Enlarged, oval, fimbriated infected RBCs with a large gametocyte and large, somewhat amoeboid trophozoites were consistent with P. ovale. Schuffner's stippling in some infected RBCs on the Giemsa-stained smear supported P. ovale; it was absent from the P. falciparum rings.", "z": "Malaria (mixed infection)", "s": "Thick and thin blood smears. The thin smear was stained with Wright-Giemsa and the unstained smear was later stained with Giemsa at a pH near 7.2. EDTA blood PCR confirmed the mixed infection.", "g": 0}, {"n": "Plasmodium spp.", "y": 2010, "c": 271, "m": "March", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2010/case271.html", "p": "The DPDx Team received Giemsa-stained blood smears from a state health laboratory for […] confirmation or identification. The patient travels internationally on a regular basis for business and, in the month before becoming ill, had traveled to India, Malaysia, and China.", "d": "Infected red blood cells are enlarged and show Schüffner's dots. Amoeboid […], gametocytes with fine pigment, and schizonts with more than 13 merozoites are also present.", "f": "Infected red blood cells are enlarged and show Schüffner's dots. Amoeboid trophozoites, gametocytes with fine pigment, and schizonts with more than 13 merozoites are also present.", "z": "Malaria", "s": "Giemsa-stained thin blood smear", "g": 0}, {"n": "Schistosoma mansoni", "y": 2010, "c": 272, "m": "March", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2010/case272.html", "p": "A 35-year-old man from the United Arab Emirates was admitted with upper and lower abdominal pain. Biopsies of the greater omentum and appendix were sectioned and stained at a pathology laboratory.", "d": "Cross-sections of adult worms show a female residing in the male's gynecophoral canal. Egg sections include cross-sections showing miracidia and transverse sections, one displaying the lateral spine characteristic of […].", "f": "Cross-sections of adult worms show a female residing in the male's gynecophoral canal. Egg sections include cross-sections showing miracidia and transverse sections, one displaying the lateral spine characteristic of S. mansoni.", "z": "Schistosomiasis", "s": "Greater omentum and appendix biopsies, sectioned and stained with hematoxylin and eosin (H&E)", "g": 0}, {"n": "Trichuris trichiura", "y": 2010, "c": 273, "m": "April", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2010/case273.html", "p": "A 68-year-old man had a routine colonoscopy at a local V.A. Medical Center. He had no complaints of illness but had recently traveled to Ethiopia. A worm-like object about 30 millimeters long was observed and recovered.", "d": "The worm had a short, thick posterior end and a long, slender, whip-like anterior end. A coiled posterior end and a spicule identified it as a male.", "f": "The worm had a short, thick posterior end and a long, slender, whip-like anterior end. A coiled posterior end and a spicule identified it as a male.", "z": "Trichuriasis", "s": "Whole worm recovered during colonoscopy and examined by dissecting and compound microscopy.", "g": 0}, {"n": "Plasmodium spp.", "y": 2010, "c": 277, "m": "June", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2010/case277.html", "p": "A 29-year-old female went to her health care provider with fever and headache two weeks after returning home from trips to Uganda and Sudan. She said she took […] prophylaxis only when she did not feel well. Her physician ordered a blood smear.", "d": "Infected red blood cells were smaller than normal and contained parasites with coarse pigment. Basket-form and band-form […] were seen, along with a schizont containing fewer than 12 merozoites.", "f": "Infected red blood cells were smaller than normal and contained parasites with coarse pigment. Basket-form and band-form trophozoites were seen, along with a schizont containing fewer than 12 merozoites.", "z": "Malaria", "s": "Giemsa-stained thin blood smear, examined by microscopy", "g": 0}, {"n": "Enterobius vermicularis", "y": 2010, "c": 281, "m": "August", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2010/case281.html", "p": "A twenty-year-old male from India presented with recurrent abdominal pain and underwent an appendectomy at a local medical center. Sections of the appendix were sectioned and stained with hematoxylin and eosin (H&E).", "d": "Diagnostic features include platymyarian muscle cells, prominent lateral alae, and embryonated eggs in utero that are flattened on one side.", "f": "Diagnostic features include platymyarian muscle cells, prominent lateral alae, and embryonated eggs in utero that are flattened on one side.", "z": "Enterobiasis (pinworm infection)", "s": "Appendix tissue sections, H&E stain", "g": 0}, {"n": "Plasmodium spp.", "y": 2010, "c": 285, "m": "October", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2010/case285.html", "p": "A 33-year-old woman developed fever, chills, and rigors within three days of returning to the U.[…] a two-week trip to Togo and Benin. She had not taken […] prophylaxis because her baggage was lost between countries during travel. She sought care at a local hospital, where she gave her travel history and blood smears were ordered.", "d": "Infected red blood cells were moderately enlarged, with Schüffner's stippling, and some were fimbriated. […] were large and slightly amoeboid, and a large gametocyte was seen in an enlarged red blood cell.", "f": "Infected red blood cells were moderately enlarged, with Schüffner's stippling, and some were fimbriated. Trophozoites were large and slightly amoeboid, and a large gametocyte was seen in an enlarged red blood cell.", "z": "Malaria", "s": "Thick and thin blood smears, stained with Giemsa and examined at 1000x oil magnification.", "g": 0}, {"n": "Plasmodium spp.", "y": 2010, "c": 287, "m": "November", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2010/case287.html", "p": "A 29-year-old pregnant woman from Ethiopia went to a hospital with nausea, vomiting, abdominal pain, and episodic fever. Symptoms began within a day of arriving in the United States and had lasted five days before hospitalization. Because of her country of origin, blood was collected in EDTA for […] screening. She reported being treated for […] about one year earlier, with medications unknown.", "d": "Infected red blood cells were normal-sized, with small, delicate rings containing small chromatin dots, and appliqué forms were present in several images. A white blood cell in one image contained ingested […] pigment, though that image showed no parasites.", "f": "Infected red blood cells were normal-sized, with small, delicate rings containing small chromatin dots, and appliqué forms were present in several images. A white blood cell in one image contained ingested malarial pigment, though that image showed no parasites.", "z": "Malaria", "s": "Wright-stained thin blood smear (blood collected in EDTA)", "g": 0}, {"n": "Phthirus pubis", "y": 2011, "c": 292, "m": "February", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2011/case292.html", "p": "A 35-year-old man returned from a week-long business trip to Las Vegas and found what appeared to be insects among his clothing. Because of recent public attention to bed bugs in hotels, he took the insects to his local extension office for identification. The specimens averaged 2 mm in length. They were cleared and mounted in balsam for identification by the state entomologist.", "d": "The specimens' size fit […]. They had six legs ending in tarsi adapted for gripping hair shafts, and antennae, which ruled out ticks and […]. The specimen shown as a gravid female had an egg visible inside her body.", "f": "The specimens' size fit P. pubis. They had six legs ending in tarsi adapted for gripping hair shafts, and antennae, which ruled out ticks and mites. The specimen shown as a gravid female had an egg visible inside her body.", "z": "Pthiriasis", "s": "Insects collected from clothing, cleared, and mounted in balsam", "g": 0}, {"n": "Giardia lamblia", "y": 2011, "c": 293, "m": "February", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2011/case293.html", "p": "A seven-year-old child (sex not stated) was taken to a doctor for abdominal pain, gas, bloating, and intermittent diarrhea. Symptoms began about two days after the child returned from summer camp. Stool was collected in formalin and polyvinyl alcohol (PVA) and sent to a commercial lab for ova-and-parasite examination.", "d": "[…] cysts were ovoid and showed nuclei, axonemes, and median bodies. […] cysts were oval to lemon-shaped, with a single nucleus and a cytostome along a lateral edge, and were slightly smaller than the […] cysts.", "f": "G. duodenalis cysts were ovoid and showed nuclei, axonemes, and median bodies. C. mesnili cysts were oval to lemon-shaped, with a single nucleus and a cytostome along a lateral edge, and were slightly smaller than the Giardia cysts.", "z": "Giardiasis", "s": "Stool; trichrome-stained smear made from PVA-preserved stool, imaged at 1000x magnification.", "g": 1}, {"n": "Strongyloides stercoralis", "y": 2011, "c": 294, "m": "February", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2011/case294.html", "p": "A 45-year-old woman originally from Africa saw her primary care provider with diarrhea, nausea, vomiting, weight loss, and gastritis. Symptoms began about three months after a kidney transplant.", "d": "The images showed first-stage rhabditoid (L1) larvae. Identification rested on a short buccal canal, a prominent genital primordium, and a rhabditoid esophagus, which distinguish these larvae from […] larvae. No size was given.", "f": "The images showed first-stage rhabditoid (L1) larvae. Identification rested on a short buccal canal, a prominent genital primordium, and a rhabditoid esophagus, which distinguish these larvae from hookworm larvae. No size was given.", "z": "Strongyloidiasis", "s": "Stool collected in formalin and polyvinyl alcohol (PVA) for routine ova-and-parasite examination. A wet mount of the formalin-preserved stool was examined microscopically by the attending pathologist, and images were captured at 400x magnification.", "g": 0}, {"n": "Plasmodium spp.", "y": 2011, "c": 295, "m": "March", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2011/case295.html", "p": "A hospital laboratory sent a tube of EDTA blood and Wright-Giemsa stained blood smears (thick and thin) to the DPDx Team for […] confirmation and identification. No travel history was available.", "d": "Infected red blood cells were greatly enlarged, and schizonts contained more than 15 merozoites. Amoeboid […], large round gametocytes with fine pigment, and faint Schüffner's stippling were also present. The morphology raised suspicion of a mixed infection with […], but nested PCR detected only […].", "f": "Infected red blood cells were greatly enlarged, and schizonts contained more than 15 merozoites. Amoeboid trophozoites, large round gametocytes with fine pigment, and faint Schüffner's stippling were also present. The morphology raised suspicion of a mixed infection with P. falciparum, but nested PCR detected only P. vivax.", "z": "Malaria (P. vivax)", "s": "EDTA blood and Wright-Giemsa stained thick and thin blood smears, examined by microscopy. Conventional (nested) PCR was performed on the EDTA blood.", "g": 0}, {"n": "Entamoeba histolytica", "y": 2011, "c": 296, "m": "March", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2011/case296.html", "p": "A 30-year-old man saw his primary care provider with abdominal pain, fatigue, and diarrhea, sometimes with blood. He had recently returned from a two-week trip to Armenia. Moderate numbers of objects averaging 25 micrometers in length were seen on a trichrome-stained smear at 1000x magnification.", "d": "[…] contained ingested red blood cells, and nuclei showed evenly distributed peripheral chromatin with a centrally located karyosome. Some […] also showed progressive pseudopods. Species-level identification as […] requires ingested red blood cells; without them, the finding is reported as […]/dispar, and further testing such as PCR is recommended.", "f": "Trophozoites contained ingested red blood cells, and nuclei showed evenly distributed peripheral chromatin with a centrally located karyosome. Some trophozoites also showed progressive pseudopods. Species-level identification as E. histolytica requires ingested red blood cells; without them, the finding is reported as E. histolytica/dispar, and further testing such as PCR is recommended.", "z": "Amebiasis", "s": "Stool, collected in 10% formalin and poly-vinyl alcohol (PVA) for ova-and-parasite examination. A smear prepared from the PVA-preserved specimen was stained with trichrome.", "g": 0}, {"n": "Plasmodium spp.", "y": 2011, "c": 302, "m": "June", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2011/case302.html", "p": "A 42-year-old man presented to his health care provider with fever, chills, and mild myalgia. His occupation requires frequent travel to Indonesia and Malaysia, and he often does not take […] prophylaxis. Blood smears were ordered, stained with Giemsa, and examined at 1000x magnification with oil, using both thick and thin smears.", "d": "Compact gametocytes with coarse pigment appeared in red blood cells that were normal-sized or smaller. A band-form trophozoite and basket-form […] in smaller-than-normal red blood cells were consistent with […], and an immature schizont was seen in a normal-sized red blood cell.", "f": "Compact gametocytes with coarse pigment appeared in red blood cells that were normal-sized or smaller. A band-form trophozoite and basket-form trophozoites in smaller-than-normal red blood cells were consistent with P. malariae, and an immature schizont was seen in a normal-sized red blood cell.", "z": "Malaria", "s": "Blood smears (thick and thin), Giemsa-stained, examined by microscopy", "g": 0}, {"n": "Trichomonas tenax", "y": 2011, "c": 303, "m": "July", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2011/case303.html", "p": "A 51-year-old man was brought to the emergency room after a friend noticed he was barely responsive. The friend reported about three weeks of upper respiratory symptoms and mild fever, plus a progressive cough for about one week. A chest X-ray showed a large left pleural effusion and a right mediastinal shift. A chest tube drained two liters of pressurized, foul-smelling purulent fluid, which was sent for microbiological workup.", "d": "[…] showed four anteriorly directed flagella, a posteriorly directed axostyle, and an undulating membrane, which can be mistaken for a fifth anterior flagellum.", "f": "Trophozoites showed four anteriorly directed flagella, a posteriorly directed axostyle, and an undulating membrane, which can be mistaken for a fifth anterior flagellum.", "z": "Not named on the page. The answer identifies the organism in the pleural fluid, which it describes as probably incidental.", "s": "Pleural fluid, examined on Wright-Giemsa-stained slide preparations.", "g": 0}, {"n": "Enterobius vermicularis", "y": 2011, "c": 305, "m": "August", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2011/case305.html", "p": "A 20-year-old male from India had recurrent abdominal pain and underwent an appendectomy at a local medical center.", "d": "The appendix sections showed platymyarian muscle cells and prominent lateral alae. Embryonated eggs within the uterus were flattened on one side.", "f": "The appendix sections showed platymyarian muscle cells and prominent lateral alae. Embryonated eggs within the uterus were flattened on one side.", "z": "Enterobiasis (pinworm infection)", "s": "Sections of the appendix, stained with hematoxylin and eosin (H&E).", "g": 0}, {"n": "Plasmodium spp.", "y": 2011, "c": 306, "m": "August", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2011/case306.html", "p": "A 41-year-old woman from the Amazon region of Brazil presented to a local hospital with fever, chills, and myalgia. The health care provider ordered thick and thin blood smears for routine parasitological examination.", "d": "Crescent-shaped gametocytes are consistent with […]. Large amoeboid […] in enlarged red blood cells, infected red blood cells with Schüffner's stippling, large gametocytes in enlarged red blood cells, and a mature schizont with about 15 merozoites are consistent with […].", "f": "Crescent-shaped gametocytes are consistent with P. falciparum. Large amoeboid trophozoites in enlarged red blood cells, infected red blood cells with Schüffner's stippling, large gametocytes in enlarged red blood cells, and a mature schizont with about 15 merozoites are consistent with P. vivax.", "z": "Malaria (mixed infection)", "s": "Thick and thin blood smears, stained with Giemsa and examined at 1000x oil immersion.", "g": 0}, {"n": "Trichuris trichiura", "y": 2011, "c": 307, "m": "September", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2011/case307.html", "p": "Stool specimens were collected from Haitian patients at a refugee clinic for routine ova-and-parasite (O&P) examination. The specimens were preserved in 10% formalin and polyvinyl alcohol (PVA) and sent to the county public health laboratory. Low numbers of objects were seen in a concentrated wet mount of one patient's formalin-preserved stool. The objects averaged 53 micrometers long by 22 micrometers wide.", "d": "The objects were unembryonated, barrel-shaped eggs within the size range for […]. They had a thick shell and hyaline polar plugs.", "f": "The objects were unembryonated, barrel-shaped eggs within the size range for T. trichiura. They had a thick shell and hyaline polar plugs.", "z": "Trichuriasis", "s": "Stool, examined as a concentrated wet mount of formalin-preserved specimen", "g": 0}, {"n": "Wuchereria bancrofti", "y": 2011, "c": 311, "m": "November", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2011/case311.html", "p": "A 55-year-old homebound man or woman (sex not stated) with Type II diabetes, originally from Haiti, was hospitalized with severe abdominal pain and vomiting of blood. Blood was collected for routine hematology work-up, and digital images of a Wright-stained thin smear from a specimen drawn at 2:25 AM were emailed to the DPDx team for diagnostic help without measurements.", "d": "The […] were sheathed, with an unstained sheath, a relatively short head space, and an anucleate tail. Nocturnal periodicity and a history of residence in an area endemic for […] were also cited as diagnostic criteria.", "f": "The microfilariae were sheathed, with an unstained sheath, a relatively short head space, and an anucleate tail. Nocturnal periodicity and a history of residence in an area endemic for W. bancrofti were also cited as diagnostic criteria.", "z": "Bancroft's filariasis (lymphatic filariasis)", "s": "Blood; Wright-stained thin blood smear", "g": 0}, {"n": "Ascaris lumbricoides", "y": 2012, "c": 315, "m": "January", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2012/case315.html", "p": "A 31-year-old man from Ecuador vomited what appeared to be a long, worm-like object measuring 27 centimeters. The object was sent to a pathology laboratory, where it was sectioned and stained with hematoxylin and eosin (H&E) for microscopic examination.", "d": "The adult worm was within the size range for […]. Sections showed tall musculature, an intestine with a brush border, coiled ovaries, and paired uterine tubes filled with eggs that have mammillated shells.", "f": "The adult worm was within the size range for A. lumbricoides. Sections showed tall musculature, an intestine with a brush border, coiled ovaries, and paired uterine tubes filled with eggs that have mammillated shells.", "z": "Ascariasis", "s": "Vomited adult worm, sectioned and stained with H&E", "g": 0}, {"n": "Echinococcus granulosus", "y": 2012, "c": 321, "m": "April", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2012/case321.html", "p": "A 55-year-old man from the Middle East with chronic abdominal pain was seen by his health care provider.", "d": "Diagnostic features were refractile hooklets and protoscoleces.", "f": "Diagnostic features were refractile hooklets and protoscoleces.", "z": "Hydatid disease (echinococcosis)", "s": "Not stated on the page.", "g": 0}, {"n": "Plasmodium spp.", "y": 2012, "c": 323, "m": "May", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2012/case323.html", "p": "A 50-year-old man from Cambodia was admitted to the hospital with recurrent fevers. A blood specimen collected in EDTA was examined by thin smear stained with Wright-Giemsa and initially reported as […] he was treated for that. One month later he returned with recurrent fevers. No international travel was documented between visits. A second EDTA blood specimen was examined the same way, and images from both collection dates were sent to DPDx for diagnostic assistance.", "d": "The first specimen showed only ring-form […] in normal-sized red blood cells, with thin, delicate cytoplasm, some double chromatin dots, and appliqué forms. The second specimen showed pleomorphic gametocytes in enlarged infected red blood cells with Schüffner's stippling, plus a developing amoeboid trophozoite with a single large chromatin dot.", "f": "The first specimen showed only ring-form trophozoites in normal-sized red blood cells, with thin, delicate cytoplasm, some double chromatin dots, and appliqué forms. The second specimen showed pleomorphic gametocytes in enlarged infected red blood cells with Schüffner's stippling, plus a developing amoeboid trophozoite with a single large chromatin dot.", "z": "Malaria, dual infection with P. falciparum and P. vivax", "s": "EDTA whole blood; thin blood smears stained with Wright-Giemsa for microscopy, and conventional (nested) PCR on EDTA blood from both collection dates.", "g": 0}, {"n": "Schistosoma haematobium", "y": 2012, "c": 324, "m": "May", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2012/case324.html", "p": "A 58-year-old woman who had emigrated from Africa was seen by her health care provider for complications of squamous cell carcinoma of the cervix. Pelvic CT scans revealed a small bladder mass. Bladder biopsy specimens and later bladder washings were sent to pathology. The attending pathologist saw structures suggestive of a parasite and sent digital images to the DPDx team. In the bladder washings, the object shown measured 150 micrometers in length.", "d": "Eggs were present in bladder tissue, and the eggs were elongated and non-operculated with a terminal spine, within the size range for […]. Eggs in the biopsy sections contained defined miracidia, and a free ciliated miracidium was seen in the washings.", "f": "Eggs were present in bladder tissue, and the eggs were elongated and non-operculated with a terminal spine, within the size range for S. haematobium. Eggs in the biopsy sections contained defined miracidia, and a free ciliated miracidium was seen in the washings.", "z": "Schistosomiasis", "s": "Bladder biopsy tissue sections stained with hematoxylin and eosin (H&E), and bladder washings stained with Papanicolaou stain.", "g": 0}, {"n": "Trichuris trichiura", "y": 2012, "c": 326, "m": "June", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2012/case326.html", "p": "A 65-year-old female from northern California had a colonoscopy as part of routine screening. A foreign body was observed and removed. The specimen was sectioned, stained with hematoxylin and eosin (H&E), and examined by the attending pathologist.", "d": "The specimen showed a thick, annulated cuticle, a nucleated hypodermis, and somatic muscle cells. It also had a bacillary band and barrel-shaped eggs with polar plugs.", "f": "The specimen showed a thick, annulated cuticle, a nucleated hypodermis, and somatic muscle cells. It also had a bacillary band and barrel-shaped eggs with polar plugs.", "z": "Trichuriasis (whipworm)", "s": "Foreign body removed during colonoscopy; sectioned and stained with H&E.", "g": 0}, {"n": "Plasmodium spp.", "y": 2012, "c": 330, "m": "August", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2012/case330.html", "p": "A 36-year-old man, who was HIV-positive and taking medication, had recurring episodes of sharp fevers, night sweats, loss of appetite, and weight loss. He had worked in Liberia for some time and reported taking […] prophylaxis. A bone marrow aspirate was obtained because of his HIV status, to evaluate marrow productive capacity. The attending pathologist noted that the aspirate was diluted with peripheral blood and appeared to contain […] parasites, so the smears were sent to the DPDx Team.", "d": "Parasites included a compact gametocyte and immature schizonts, each with coarse pigment inside red blood cells that were smaller than normal. These features supported the diagnosis.", "f": "Parasites included a compact gametocyte and immature schizonts, each with coarse pigment inside red blood cells that were smaller than normal. These features supported the diagnosis.", "z": "Malaria", "s": "Bone marrow aspirate; smears stained with Wright-Giemsa and examined by light microscopy.", "g": 0}, {"n": "Entamoeba histolytica", "y": 2012, "c": 331, "m": "September", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2012/case331.html", "p": "A 35-year-old woman who had emigrated from Azerbaijan five years earlier presented to her health care provider with abdominal pain. A CT scan showed multiple pancreatic cysts. She reported having been diagnosed with pancreatic cysts while still living in Azerbaijan. The cysts were aspirated, and the fluid was sent to Pathology for histological workup. The organisms measured 12-15 micrometers on average.", "d": "The […] contained a single nucleus with fine, evenly distributed peripheral chromatin and a discrete central karyosome, though the nucleus was not visible in one focal plane. No morphologic criteria separate them from […], but the pancreatic location indicates invasive infection and supports species-level identification.", "f": "The trophozoites contained a single nucleus with fine, evenly distributed peripheral chromatin and a discrete central karyosome, though the nucleus was not visible in one focal plane. No morphologic criteria separate them from E. dispar, but the pancreatic location indicates invasive infection and supports species-level identification.", "z": "Amebiasis", "s": "Pancreatic cyst aspirate fluid, stained with trichrome", "g": 0}, {"n": "Plasmodium spp.", "y": 2012, "c": 335, "m": "November", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2012/case335.html", "p": "A state health laboratory received Wright-stained blood films from a patient for […] confirmation and identification. The patient had most recently traveled to Pakistan but had been in the U.S. for the past nine months with no further international travel. The next day, the lab received additional blood films from the same patient, sent by a different hospital. These were Giemsa-stained. Images from both sets were sent to CDC-DPDx for diagnostic assistance.", "d": "Diagnostic features included rings with thick, sturdy cytoplasm, developing […] becoming amoeboid, and large, round gametocytes with fine pigment. Schüffner's stippling was seen in the Giemsa-stained specimens, and infected RBCs were enlarged.", "f": "Diagnostic features included rings with thick, sturdy cytoplasm, developing trophozoites becoming amoeboid, and large, round gametocytes with fine pigment. Schüffner's stippling was seen in the Giemsa-stained specimens, and infected RBCs were enlarged.", "z": "Malaria", "s": "Blood films (Wright-stained and Giemsa-stained), examined microscopically", "g": 0}, {"n": "Taenia saginata", "y": 2013, "c": 340, "m": "January", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2013/case340.html", "p": "A 43-year-old woman with no documented international travel had a pair of proglottids reportedly found in her feces. A state health lab submitted them for cestode confirmation and identification. The specimens averaged 12.0 mm long by 3.0 mm wide.", "d": "The proglottids have a single, prominent lateral genital pore. Each side has more than 13 primary uterine branches around the central uterine stem.", "f": "The proglottids have a single, prominent lateral genital pore. Each side has more than 13 primary uterine branches around the central uterine stem.", "z": "Taeniasis (beef tapeworm)", "s": "Proglottids preserved in 70% ethanol, then soaked in lactophenol for several hours to clear them for examination.", "g": 0}, {"n": "Plasmodium spp.", "y": 2013, "c": 350, "m": "June", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2013/case350.html", "p": "A 45-year-old man with travel history to Ghana presented with recurrent fever and chills. He had not taken any […] prophylaxis during his travels. The laboratory initially reported […] on Wright-stained blood smears and requested confirmation, so the slides and EDTA blood were sent to CDC-DPDx.", "d": "Thin, delicate rings in normal-sized RBCs, some with double chromatin dots and appliqué forms, were more consistent with […]. Enlarged or oval infected RBCs with fimbriation, and […] and gametocytes (with coarse pigment) in enlarged RBCs, were consistent with […].", "f": "Thin, delicate rings in normal-sized RBCs, some with double chromatin dots and appliqué forms, were more consistent with P. falciparum. Enlarged or oval infected RBCs with fimbriation, and trophozoites and gametocytes (with coarse pigment) in enlarged RBCs, were consistent with P. ovale.", "z": "Malaria, a mixed infection with two Plasmodium species", "s": "Thin blood smears stained with Wright's stain (microscopy); EDTA blood for real-time PCR, which confirmed the mixed infection.", "g": 0}, {"n": "Ancylostoma duodenale", "y": 2013, "c": 355, "m": "September", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2013/case355.html", "p": "A 65-year-old man had a worm-like object, about 11.0 mm long, removed during a routine colonoscopy. He had no gastrointestinal complaints and no documented international travel. The specimen was sectioned and stained with hematoxylin and eosin for histology. Follow-up stool ova-and-parasite examinations were negative.", "d": "The diagnosis rested on a large, prominent buccal capsule, a strong, muscular, club-

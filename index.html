shaped esophagus, a thick and relatively smooth cuticle, and a nucleated intestine with a conspicuous microvillus border. The genus could not be determined, because sectioning obscured the mouthpart structures needed to separate […] from […].", "f": "The diagnosis rested on a large, prominent buccal capsule, a strong, muscular, club-shaped esophagus, a thick and relatively smooth cuticle, and a nucleated intestine with a conspicuous microvillus border. The genus could not be determined, because sectioning obscured the mouthpart structures needed to separate Necator from Ancylostoma.", "z": "Intestinal hookworm infection", "s": "Worm removed during colonoscopy; histological sectioning with H&E staining", "g": 0}, {"n": "Plasmodium spp.", "y": 2013, "c": 357, "m": "October", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2013/case357.html", "p": "A 59-year-old man needed emergency medical care for fever above 40 °C (104 °F), generalized convulsions, and signs of renal failure. His recent travel history was not available.", "d": "Late compact […] appear in normal-sized erythrocytes. Elongate, banana-shaped gametocytes, schizonts with about 16-18 small merozoites, and thin, delicate rings are also present. In nonimmune patients, hyperparasitemia (>5% parasitized erythrocytes or >250,000 parasites/µl) and mature forms indicate severe […].", "f": "Late compact trophozoites appear in normal-sized erythrocytes. Elongate, banana-shaped gametocytes, schizonts with about 16-18 small merozoites, and thin, delicate rings are also present. In nonimmune patients, hyperparasitemia (>5% parasitized erythrocytes or >250,000 parasites/µl) and mature forms indicate severe malaria.", "z": "Malaria (P. falciparum)", "s": "EDTA-anticoagulated blood, examined as Wright-stained thick and thin blood smears at 1000x magnification.", "g": 0}, {"n": "Plasmodium spp.", "y": 2013, "c": 359, "m": "November", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2013/case359.html", "p": "A 19-year-old female came to the emergency room with fever, chills, and nausea occurring on a 48-hour cycle. She had traveled to the Bahamas and Tanzania but had not been abroad for about nine months. She had been diagnosed with […] falciparum […] five months before these symptoms and was treated.", "d": "Infected RBCs were elongated and fimbriated, with Schüffner's stippling. Rings had sturdy cytoplasm and a single large chromatin dot, and gametocytes were slightly enlarged and rounded with coarse pigment.", "f": "Infected RBCs were elongated and fimbriated, with Schüffner's stippling. Rings had sturdy cytoplasm and a single large chromatin dot, and gametocytes were slightly enlarged and rounded with coarse pigment.", "z": "Malaria (probable relapse)", "s": "Blood films stained with Wright-Giemsa and examined microscopically by the attending pathologist.", "g": 0}, {"n": "Trypanosoma gambiense", "y": 2013, "c": 362, "m": "December", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2013/case362.html", "p": "A 29-year-old female post-graduate student in Zoology traveled to the Democratic Republic of Congo to see lowland gorillas. She reported numerous insect bites during the trip and had taken […] prophylaxis. About one week after returning home, she developed fever. About a month later, she had headaches, itchy skin, and swollen lymph nodes, and she sought medical attention.", "d": "The organisms were […] with a centrally located nucleus, an undulating membrane, and a flagellum running along the membrane, plus a small kinetoplast at the anterior end. Dividing forms were also seen.", "f": "The organisms were trypomastigotes with a centrally located nucleus, an undulating membrane, and a flagellum running along the membrane, plus a small kinetoplast at the anterior end. Dividing forms were also seen.", "z": "African trypanosomiasis", "s": "Blood smears, stained with Wright-Giemsa and examined microscopically.", "g": 1}, {"n": "Echinococcus granulosus", "y": 2014, "c": 366, "m": "February", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2014/case366.html", "p": "A 28-year-old man from Algeria presented with right upper quadrant abdominal pain. Imaging during his workup showed a complex solid and cystic lesion in the posterior right hepatic dome. The hepatic cyst fluid was aspirated and submitted for ova-and-parasite (O&P) testing.", "d": "Wet-mount microscopy showed individual protoscoleces with characteristic suckers and refractile hooks. The single cyst was also consistent with […].", "f": "Wet-mount microscopy showed individual protoscoleces with characteristic suckers and refractile hooks. The single cyst was also consistent with E. granulosus.", "z": "Echinococcosis", "s": "Hepatic cyst fluid aspirate, examined as a wet-mount of the sediment.", "g": 0}, {"n": "Plasmodium spp.", "y": 2014, "c": 368, "m": "March", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2014/case368.html", "p": "An eight-year-old boy had intermittent fevers and had recently returned from Kenya. He had not taken […] prophylaxis during travel. Blood was collected in EDTA for a hematologic workup. A BinaxNOW […] antigen test was negative. Thin blood smears stained with Wright-Giemsa were examined, and digital images were sent for a telediagnosis consult.", "d": "Compact developing […], Schüffner's stippling (often less pronounced or absent on Wright-Giemsa-stained smears than on traditional Giemsa-stained smears), and elongated, fimbriated infected red blood cells.", "f": "Compact developing trophozoites, Schüffner's stippling (often less pronounced or absent on Wright-Giemsa-stained smears than on traditional Giemsa-stained smears), and elongated, fimbriated infected red blood cells.", "z": "Malaria", "s": "EDTA-anticoagulated blood; thin blood smears stained with Wright-Giemsa.", "g": 0}, {"n": "Trypanosoma cruzi", "y": 2014, "c": 372, "m": "May", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2014/case372.html", "p": "A 45-year-old man originally from Mexico presented with a left groin lymphocele, erythema, and swelling in his lower extremities, along with fever and chills. This occurred about one month after a heart transplant. An endomyocardial biopsy was performed, and blood was collected in EDTA and sent to Hematology. The attending pathologist observed objects of interest on a thin blood film stained with Wright stain.", "d": "[…] showed a large posterior kinetoplast and an undulating membrane with an anteriorly directed flagellum. Some […] had a C-shaped form. The patient's Latin American origin supported the diagnosis, since the other human trypanosome, […], is endemic to Africa.", "f": "Trypomastigotes showed a large posterior kinetoplast and an undulating membrane with an anteriorly directed flagellum. Some trypomastigotes had a C-shaped form. The patient's Latin American origin supported the diagnosis, since the other human trypanosome, T. brucei, is endemic to Africa.", "z": "Chagas disease (American trypanosomiasis)", "s": "Blood collected in EDTA, examined as a thin blood film stained with Wright stain.", "g": 0}, {"n": "Taenia saginata", "y": 2014, "c": 375, "m": "July", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2014/case375.html", "p": "An 18-year-old female brought a worm-like object to her primary care provider, saying she had found it in her stool. Five years earlier she had spent two months in Mexico, and she reported seeing similar objects in her stool over those five years. The specimen went to the county public health laboratory, and stool was also preserved in 10% formalin for formalin-ethyl acetate (FEA) concentration. The worm-like object was stained with lactophenol cotton blue. Low numbers of objects averaging 30-34 μm in diameter were seen on an unstained wet mount of the FEA concentrate.", "d": "Mature proglottids had more than 13 primary uterine branches. Eggs were within the size range for […] spp., with a striated shell and an oncosphere containing hooklets.", "f": "Mature proglottids had more than 13 primary uterine branches. Eggs were within the size range for Taenia spp., with a striated shell and an oncosphere containing hooklets.", "z": "Taeniasis", "s": "Stool; FEA concentration with unstained wet mount; lactophenol cotton blue stain of the worm-like object.", "g": 0}, {"n": "Entamoeba histolytica", "y": 2014, "c": 376, "m": "July", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2014/case376.html", "p": "A state health laboratory received stool specimens for ova-and-parasite (O&P) examination. The patient was a male immigrant whose country of origin was not known. Age and symptoms are not stated. The attending microbiologist saw what she believed were […] in the wet mount and the trichrome-stained smear, with no cysts observed. The objects measured 14-25 μm in length.", "d": "The […] fell within the size range of […] had a single nucleus with evenly distributed peripheral chromatin and a discrete, central or slightly eccentric karyosome. No ingested erythrocytes were seen, so […] could not be confirmed.", "f": "The trophozoites fell within the size range of E. histolytica/dispar and had a single nucleus with evenly distributed peripheral chromatin and a discrete, central or slightly eccentric karyosome. No ingested erythrocytes were seen, so E. histolytica could not be confirmed.", "z": "Amebiasis", "s": "Stool preserved in sodium acetate-acetic acid-formalin (SAF), processed by formalin-ethyl acetate (FEA) concentration and trichrome staining. Molecular testing was not performed because SAF is unfavorable for PCR.", "g": 0}, {"n": "Plasmodium spp.", "y": 2014, "c": 377, "m": "August", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2014/case377.html", "p": "A 22-year-old man had a post-travel medical evaluation, including a hematologic work-up, after returning from an 11-day missionary trip to Honduras. Blood was collected in EDTA at a medical center, and thin smears were prepared and stained. The smears were sent to the State Public Health Laboratory for confirmation and diagnostic assistance.", "d": "Rings have thick, sturdy cytoplasm, and […] are large and very amoeboid with fine, golden pigment. Gametocytes are large and pleomorphic with fine pigment, and ookinetes were also seen, which suggests a substantial delay between blood collection and slide preparation.", "f": "Rings have thick, sturdy cytoplasm, and trophozoites are large and very amoeboid with fine, golden pigment. Gametocytes are large and pleomorphic with fine pigment, and ookinetes were also seen, which suggests a substantial delay between blood collection and slide preparation.", "z": "Malaria", "s": "Peripheral blood collected in EDTA; thin smears stained and examined microscopically, with digital images captured at 1000x oil immersion.", "g": 0}, {"n": "Strongyloides stercoralis", "y": 2014, "c": 380, "m": "September", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2014/case380.html", "p": "A 25-year-old man was hospitalized with a flare of Crohn's disease, duodenal outlet obstruction, and regional enteritis. He reported no recent travel abroad. He underwent a gastroenterostomy. Duodenal biopsies showed acute and chronic inflammation with crypt abscesses, focal ulceration, and reactive epithelial changes, without granulomas, epithelial dysplasia, or fibrosis. The pathologist noted suspected parasites, and the slides were sent through the state health department to CDC's DPDx for diagnostic help.", "d": "Small adult female worms were seen, with paired uterine tubes and a simple intestine. Numerous filariform larvae were also present, lacking reproductive structures.", "f": "Small adult female worms were seen, with paired uterine tubes and a simple intestine. Numerous filariform larvae were also present, lacking reproductive structures.", "z": "Disseminated strongyloidiasis", "s": "Duodenal biopsy slides, examined microscopically. Additional testing also found larvae in sputum.", "g": 0}, {"n": "Dicrocoelium dendriticum", "y": 2014, "c": 381, "m": "October", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2014/case381.html", "p": "A man was seen as an outpatient at a hospital in Atri, Italy. A stool specimen was collected and processed for ova-and-parasite (O&P) testing. Images of suspect parasites were sent to the DPDx Team for diagnostic assistance, and measurements were included in the original telediagnosis submission. No other information was available.", "d": "The eggs were thick-shelled, dark brown, and embryonated, within the size range for […] (35-45 µm long by 20-30 µm wide). The operculum was not readily visible on either egg.", "f": "The eggs were thick-shelled, dark brown, and embryonated, within the size range for D. dendriticum (35-45 µm long by 20-30 µm wide). The operculum was not readily visible on either egg.", "z": "Dicrocoeliasis", "s": "Stool; ova-and-parasite (O&P) examination.", "g": 0}, {"n": "Sarcoptes scabiei", "y": 2014, "c": 383, "m": "November", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2014/case383.html", "p": "A patient presented to a local hospital with encrusted lesions on his arms and legs. A skin scraping was examined unstained at 40x magnification.", "d": "Eggs and adult […] were seen in both images, which established the diagnosis.", "f": "Eggs and adult mites were seen in both images, which established the diagnosis.", "z": "Scabies (human itch mite infestation)", "s": "Skin scraping, unstained wet mount at 40x.", "g": 0}, {"n": "Plasmodium spp.", "y": 2014, "c": 385, "m": "December", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2014/case385.html", "p": "A 10-year-old girl from Pennsylvania was hospitalized with a 101.5 °F fever, vomiting, abdominal pain, and diarrhea. She had recently returned from visiting family in West Africa.", "d": "Small rings and developing […] were seen in normal-sized infected RBCs, with multiply-infected RBCs and appliqué forms. Pigment was present, and no other stages were seen. Crenated RBCs were common, probably from processing delay, and were not to be confused with the fimbriated RBCs of […].", "f": "Small rings and developing trophozoites were seen in normal-sized infected RBCs, with multiply-infected RBCs and appliqué forms. Pigment was present, and no other stages were seen. Crenated RBCs were common, probably from processing delay, and were not to be confused with the fimbriated RBCs of P. ovale.", "z": "Malaria", "s": "Blood collected in EDTA; thick and thin blood films examined by microscopy. PCR supported the morphologic diagnosis.", "g": 0}, {"n": "Trichinella spiralis", "y": 2015, "c": 389, "m": "February", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2015/case389.html", "p": "A hunter presented with abdominal pain and fever, which later progressed to difficulty breathing with a nonproductive cough and rash. He had recently eaten undercooked bear meat. Blood tests showed elevated peripheral eosinophilia, and serologic tests were pending. He provided portions of the remaining bear meat for parasitological testing at the CDC.", "d": "The objects were […] larvae encapsulated within the bear's muscle tissue. Species-level identification came from molecular testing (PCR followed by sequencing).", "f": "The objects were Trichinella larvae encapsulated within the bear's muscle tissue. Species-level identification came from molecular testing (PCR followed by sequencing).", "z": "Trichinellosis", "s": "Bear meat, examined by compression preparation and by artificial gastric digestion (pepsin and hydrochloric acid at 37°C for a few hours).", "g": 0}, {"n": "Plasmodium spp.", "y": 2015, "c": 392, "m": "March", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2015/case392.html", "p": "A 39-year-old male from Fiji presented to a hospital in Pohnpei, Federated States of Micronesia (FSM) with fever, chills, and head and body aches. Blood work showed a normal platelet count, a low WBC count, and raised ALT and creatinine. Serologic testing for leptospirosis was negative. About five days before arriving in the FSM, he had spent nearly a month in the Solomon Islands.", "d": "Infected red blood cells are enlarged, and […] are amoeboid. Schüffner's stippling is present.", "f": "Infected red blood cells are enlarged, and trophozoites are amoeboid. Schüffner's stippling is present.", "z": "Malaria", "s": "Blood smears collected in EDTA, stained with a rapid stain, and examined by microscopy", "g": 0}, {"n": "Trichuris trichiura", "y": 2015, "c": 393, "m": "April", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2015/case393.html", "p": "A 59-year-old female immigrant presented at a local hospital with microcytic/hypochromic anemia and eosinophilia. An exploratory colonoscopy was performed, and an object measuring 40 mm in length was observed and recovered. Routine ova-and-parasite (O&P) results were not available.", "d": "The anterior portion of the adult worm is long and slender, resembling a whip's lash, and threads into the host's mucosa. The posterior portion is thicker, like a whip's handle; females have a blunt posterior end, while males have a coiled posterior end.", "f": "The anterior portion of the adult worm is long and slender, resembling a whip's lash, and threads into the host's mucosa. The posterior portion is thicker, like a whip's handle; females have a blunt posterior end, while males have a coiled posterior end.", "z": "Trichuriasis", "s": "Object recovered during exploratory colonoscopy", "g": 0}, {"n": "Plasmodium spp.", "y": 2015, "c": 398, "m": "June", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2015/case398.html", "p": "A 31-year-old male construction worker sought medical attention a few days after returning to the U.[…] nine months of contract work in Ghana. He had recurring fever and chills. He had been advised to take […] prophylaxis before his assignment but admitted he did not take it as prescribed.", "d": "Infected red blood cells are smaller than uninfected cells. The parasites include a \"birds-eye\" ring-form trophozoite, band-form […] with coarse pigment, and schizonts with fewer than 12 merozoites in a rosette around a central pigment mass. A small, round gametocyte with coarse pigment is also present.", "f": "Infected red blood cells are smaller than uninfected cells. The parasites include a \"birds-eye\" ring-form trophozoite, band-form trophozoites with coarse pigment, and schizonts with fewer than 12 merozoites in a rosette around a central pigment mass. A small, round gametocyte with coarse pigment is also present.", "z": "Malaria", "s": "Thick and thin blood smears, stained with the rapid stain routinely used by the laboratory.", "g": 0}, {"n": "Enterobius vermicularis", "y": 2015, "c": 400, "m": "July", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2015/case400.html", "p": "A ten-year-old boy presented at a local hospital with symptoms mimicking appendicitis. An appendectomy was performed, and biopsy specimens were sent to Pathology for routine histologic work-up, where the attending pathologist observed objects suggestive of a parasite.", "d": "Diagnostic features include platymyarian musculature with relatively few cells per quadrant, prominent lateral alae, and elongate eggs with a thick shell. The eggs fall within the expected size range for […] (50-60 µm in length).", "f": "Diagnostic features include platymyarian musculature with relatively few cells per quadrant, prominent lateral alae, and elongate eggs with a thick shell. The eggs fall within the expected size range for E. vermicularis (50-60 µm in length).", "z": "Enterobiasis", "s": "Appendectomy biopsy specimens, examined as hematoxylin and eosin (H&E)-stained slides.", "g": 0}, {"n": "Plasmodium spp.", "y": 2015, "c": 403, "m": "September", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2015/case403.html", "p": "A 25-year-old man went to the emergency room with dizziness, headache, ear pain, fever, chills, and malaise about one week after returning from a missionary trip to Ghana. He reported taking his […] prophylaxis as prescribed. While hospitalized, he developed low platelets, elevated reticulocytes, and high bilirubin.", "d": "Infected red blood cells were normal in size and contained ring-form […] with thin, delicate cytoplasm, sometimes with double chromatin dots. Multiply infected cells, appliqué forms, and high parasitemia without other stages were seen, and the presence of pigment helped rule out Babesia.", "f": "Infected red blood cells were normal in size and contained ring-form trophozoites with thin, delicate cytoplasm, sometimes with double chromatin dots. Multiply infected cells, appliqué forms, and high parasitemia without other stages were seen, and the presence of pigment helped rule out Babesia.", "z": "Severe malaria", "s": "Blood collected in EDTA, examined as thick and thin blood films stained with Wright stain.", "g": 0}, {"n": "Strongyloides stercoralis", "y": 2015, "c": 407, "m": "November", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2015/case407.html", "p": "A 50-year-old male originally from Southeast Asia was undergoing chemotherapy for squamous cell carcinoma of the lung. He was admitted one week earlier with nausea, vomiting, and confusion. A chest radiograph showed pulmonary infiltrates. The objects of interest measured 500-600 micrometers in length.", "d": "The images showed infectious third-stage (L3) larvae. The key criteria were the nearly 1:1 ratio of intestine to esophagus length and a notched tail, which is visible at 1000x magnification with oil immersion.", "f": "The images showed infectious third-stage (L3) larvae. The key criteria were the nearly 1:1 ratio of intestine to esophagus length and a notched tail, which is visible at 1000x magnification with oil immersion.", "z": "Disseminated strongyloidiasis", "s": "Bronchoalveolar lavage (BAL), stained with Giemsa and Papanicolaou.", "g": 0}, {"n": "Phthirus pubis", "y": 2015, "c": 408, "m": "November", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2015/case408.html", "p": "A 65-year-old man from rural Canada had itching on his chest that persisted despite frequent bathing. Possible arthropod ectoparasites were seen in his chest hair, and one specimen was collected and sent to the microbiology lab. The object measured 1.5 mm long.", "d": "The organism is nearly as wide as it is long and has six legs, one pair of eyes, and one pair of antennae. Its middle and hind legs have enlarged grasping tarsal claws, its abdominal segments have protuberances along the sides, and an associated nit has a conical operculum.", "f": "The organism is nearly as wide as it is long and has six legs, one pair of eyes, and one pair of antennae. Its middle and hind legs have enlarged grasping tarsal claws, its abdominal segments have protuberances along the sides, and an associated nit has a conical operculum.", "z": "Pthiriasis", "s": "Arthropod collected from chest hair and sent to the microbiology lab for examination.", "g": 0}, {"n": "Plasmodium spp.", "y": 2015, "c": 410, "m": "December", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2015/case410.html", "p": "A 22-year-old man developed fever, chills, and general weakness within four days after returning to the U.[…] a one-month trip to Kenya. He sought care at a local hospital and admitted he had not been fully compliant with his […] medication.", "d": "Developing […] were sturdy and compact within normal to slightly enlarged red blood cells. Gametocytes and an immature schizont showed coarse pigment, and many infected cells were elongated and fimbriated.", "f": "Developing trophozoites were sturdy and compact within normal to slightly enlarged red blood cells. Gametocytes and an immature schizont showed coarse pigment, and many infected cells were elongated and fimbriated.", "z": "Malaria", "s": "Thin blood smear stained with Wright-Giemsa and examined at 1000x under oil immersion.", "g": 0}, {"n": "Ancylostoma duodenale", "y": 2016, "c": 411, "m": "January", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2016/case411.html", "p": "A 23-year-old female with no documented travel history presented with iron deficiency anemia and periodic abdominal pain. Stool ova-and-parasite examinations were negative. Colonoscopy revealed a worm-like object attached to the mucosa of the ascending colon.", "d": "Platymyarian somatic musculature and multinucleated intestinal cells with a brush border were seen. A copulatory bursa, wider than long and suggestive of […], indicated a male specimen.", "f": "Platymyarian somatic musculature and multinucleated intestinal cells with a brush border were seen. A copulatory bursa, wider than long and suggestive of Ancylostoma, indicated a male specimen.", "z": "Hookworm infection", "s": "The worm-like object was removed during colonoscopy, processed by routine histology, and examined in sections stained with hematoxylin and eosin (H&E).", "g": 0}, {"n": "Plasmodium spp.", "y": 2016, "c": 413, "m": "February", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2016/case413.html", "p": "A 20-year-old man from Ghana went to a hospital with flu-like illness and enlarged liver. Labs showed low platelets, a low absolute lymphocyte count, an elevated absolute monocyte count, and lymphocytes with reactive forms. A blood specimen was collected for a BinaxNOW […] rapid diagnostic test and for thick and thin blood smears stained with Giemsa.", "d": "Smears showed many ring-stage […] with no other stages present, normal-sized infected red blood cells, multiply infected red blood cells, and appliqué forms. […] pigment was present, which ruled out Babesia sp.", "f": "Smears showed many ring-stage trophozoites with no other stages present, normal-sized infected red blood cells, multiply infected red blood cells, and appliqué forms. Malarial pigment was present, which ruled out Babesia sp.", "z": "Malaria", "s": "Blood; BinaxNOW Malaria rapid diagnostic test and Giemsa-stained thick and thin blood smears", "g": 0}, {"n": "Sarcoptes scabiei", "y": 2016, "c": 416, "m": "March", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2016/case416.html", "p": "An 81-year-old woman undergoing aggressive chemotherapy for acute myeloid leukemia (AML) developed thickened, hyperkeratotic plaques between her fingers and toes. Skin scrapings from the plaques were sent to Microbiology for routine workup.", "d": "Adult […] were within the size range for […] (about 400 micrometers), with a sub-spherical body, reduced legs, and prognathous mouthparts. […] fecal pellets (scybala) were also present.", "f": "Adult mites were within the size range for S. scabiei (about 400 micrometers), with a sub-spherical body, reduced legs, and prognathous mouthparts. Mite fecal pellets (scybala) were also present.", "z": "Crusted scabies", "s": "Skin scrapings, examined as a direct preparation", "g": 0}, {"n": "Plasmodium spp.", "y": 2016, "c": 418, "m": "April", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2016/case418.html", "p": "A 34-year-old woman in New Zealand sought care for chills, fever, and headache. She had been treated for […] (species unknown) with artesunate in Mozambique in 2012, and it was unclear whether she had traveled since.", "d": "Infected red blood cells showed Schüffner's stippling, and some were elongated or fimbriated. A mature schizont with 12 merozoites and a gametocyte in a slightly enlarged red blood cell were also seen.", "f": "Infected red blood cells showed Schüffner's stippling, and some were elongated or fimbriated. A mature schizont with 12 merozoites and a gametocyte in a slightly enlarged red blood cell were also seen.", "z": "Malaria", "s": "Thin blood smear stained with Giemsa and examined under oil immersion at 1000x magnification.", "g": 0}, {"n": "Strongyloides stercoralis", "y": 2016, "c": 421, "m": "June", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2016/case421.html", "p": "A 62-year-old woman from rural Manitoba, Canada, saw a health care provider with abdominal pain, diarrhea, and elevated eosinophils in her peripheral blood.", "d": "The larvae showed a prominent genital primordium, a short buccal canal, and a rhabditoid esophagus. These features are consistent with first-stage rhabditiform (L1) larvae, the stage usually found in stool.", "f": "The larvae showed a prominent genital primordium, a short buccal canal, and a rhabditoid esophagus. These features are consistent with first-stage rhabditiform (L1) larvae, the stage usually found in stool.", "z": "Strongyloidiasis", "s": "Stool collected in sodium acetate-acetic acid-formalin (SAF), processed by formalin-ethyl acetate (FEA) concentration, and examined as a wet mount, with iodine staining for some images.", "g": 0}, {"n": "Plasmodium spp.", "y": 2016, "c": 424, "m": "July", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2016/case424.html", "p": "A 22-month-old female child presented to the emergency room after 10 days of cyclic fever and chills, decreased oral intake, and seizures. She had emigrated from a country in the Middle East with her family three months earlier. Blood was collected for routine work-up. A CBC flagged a low platelet count, and smears were stained with Wright-Giemsa. A technologist identified possible […] parasites on thin smears, and images were sent to the DPDx Team for consultation.", "d": "Morphological criteria included sturdy rings with a single large chromatin dot, large round gametocytes with fine pigment, and schizonts with more than 13 merozoites. A multiply infected RBC contained both a gametocyte and a schizont. The patient's travel history to the Middle East supported the diagnosis.", "f": "Morphological criteria included sturdy rings with a single large chromatin dot, large round gametocytes with fine pigment, and schizonts with more than 13 merozoites. A multiply infected RBC contained both a gametocyte and a schizont. The patient's travel history to the Middle East supported the diagnosis.", "z": "Malaria", "s": "Thin blood smears stained with Wright-Giemsa", "g": 0}, {"n": "Trichinella spiralis", "y": 2016, "c": 426, "m": "August", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2016/case426.html", "p": "A hunter made dried jerky from fresh bear meat and shared it with friends. Most of those who ate it developed moderate to severe abdominal pain, nausea, and fatigue within 48 hours. Some of the bear meat was submitted for laboratory testing, and stained histological sections were sent to the DPDx Team for confirmation. Patient age and sex are not stated on the page.", "d": "Encapsulated, coiled nematode larvae were seen within the meat, a feature consistent with some […] species. Nucleated stichocytes were also present, supporting the diagnosis.", "f": "Encapsulated, coiled nematode larvae were seen within the meat, a feature consistent with some Trichinella species. Nucleated stichocytes were also present, supporting the diagnosis.", "z": "Trichinellosis", "s": "Bear meat, examined as stained histological sections.", "g": 1}, {"n": "Phthirus pubis", "y": 2017, "c": 435, "m": "January", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2017/case435.html", "p": "An adult patient had irritation of the right eye and eyelid and sought care at an eye clinic. Living organisms and apparent egg cases were seen on the eyelids and eyelashes. Specimens were submitted, including two organisms measuring about 1.6 mm long and several egg cases averaging 700 µm.", "d": "[…] were present on the eyelashes and with the submitted specimens. The dorsoventrally flattened arthropod had claw-like ends on its second and third legs, and one […] was still attached to a hair shaft.", "f": "Nits were present on the eyelashes and with the submitted specimens. The dorsoventrally flattened arthropod had claw-like ends on its second and third legs, and one louse was still attached to a hair shaft.", "z": "Pthiriasis", "s": "Submitted lice and egg cases, examined under a dissecting microscope and a compound microscope (100x and 200x).", "g": 0}, {"n": "Plasmodium spp.", "y": 2017, "c": 439, "m": "March", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2017/case439.html", "p": "A 29-year-old male immigrant from Nigeria went to an emergency room with fever, enlarged spleen, jaundice, and neurologic changes. A complete blood count and chemistry panel showed anemia, low platelets, low blood sugar, mildly raised bilirubin, and lactic acidosis.", "d": "Infected red blood cells were normal in size, with parasite density above 5% of red cells, mostly compact pigmented […]. Multiply infected cells, accolade/appliqué forms, and an immature gametocyte in a normal-sized cell were also present, and the parasite morphology reflected a delay before smears were made.", "f": "Infected red blood cells were normal in size, with parasite density above 5% of red cells, mostly compact pigmented trophozoites. Multiply infected cells, accolade/appliqué forms, and an immature gametocyte in a normal-sized cell were also present, and the parasite morphology reflected a delay before smears were made.", "z": "Severe malaria", "s": "Blood, Wright-Giemsa stained thin blood smear", "g": 0}, {"n": "Plasmodium spp.", "y": 2017, "c": 443, "m": "May", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2017/case443.html", "p": "A 7-year-old girl who had recently moved to the United States from the Democratic Republic of Congo was treated for mild, non-immune hemolytic anemia. She appeared stable at evaluation.", "d": "Infected red blood cells were reduced in size, slightly enlarged, or normal-sized. […] gametocytes and ring forms were seen. […] ppeared as \"basket forms\" and as a \"band form.\"", "f": "Infected red blood cells were reduced in size, slightly enlarged, or normal-sized. P. falciparum gametocytes and ring forms were seen. P. malariae trophozoites appeared as \"basket forms\" and as a \"band form.\"", "z": "Mixed malaria infection (confirmed by PCR)", "s": "Blood smear stained with Wright-Giemsa", "g": 0}, {"n": "Echinococcus granulosus", "y": 2017, "c": 444, "m": "May", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2017/case444.html", "p": "A 37-year-old male immigrant from the Middle East sought care for pain in the upper right abdomen. Ultrasonography showed a single-compartment hepatic cyst about 7 cm in diameter, and a fine biopsy needle was used during imaging to aspirate it.", "d": "Multiple protoscoleces with refractile hooks were seen in the aspirated fluid, which identifies the larval stage of the parasite.", "f": "Multiple protoscoleces with refractile hooks were seen in the aspirated fluid, which identifies the larval stage of the parasite.", "z": "Hydatid disease (human echinococcosis)", "s": "Aspirated fluid from a hepatic cyst, collected by fine needle aspiration during ultrasonography.", "g": 0}, {"n": "Strongyloides stercoralis", "y": 2017, "c": 450, "m": "August", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2017/case450.html", "p": "A 26-year-old man who had recently emigrated from Northern Africa saw his primary care provider for 6-8 months of abdominal pain, diarrhea, and weight loss. Later testing found leukopenia, neutropenia, and elevated eosinophils in the peripheral blood. Stool preserved in SAF was sent for ova and parasite examination, and the objects were seen in a formalin-ethyl acetate concentrate with iodine preparation.", "d": "The answer cites a short buccal cavity, a rhabditoid esophagus, a prominent genital primordium, and a tapered tail as diagnostic morphologic features.", "f": "The answer cites a short buccal cavity, a rhabditoid esophagus, a prominent genital primordium, and a tapered tail as diagnostic morphologic features.", "z": "Strongyloidiasis", "s": "Stool preserved in SAF; formalin-ethyl acetate (FEA) concentrate with iodine prep (O&P)", "g": 0}, {"n": "Enterobius vermicularis", "y": 2017, "c": 458, "m": "December", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2017/case458.html", "p": "A 69-year-old male with recent travel to Peru underwent a routine colonoscopy as a colorectal cancer screen. He was asymptomatic, and a stool ova and parasite examination performed before the procedure was negative. The gastroenterologist recovered a worm from the ascending colon during the procedure and sent it to pathology for identification. Eggs inside the worm averaged 50 x 25 micrometers.", "d": "The worm showed cephalic expansions, an esophagus, and the anterior end of the esophageal bulb. Eggs within the worm were flattened on one side, and their average size fell within the range for the species. The colon was the anatomical recovery site.", "f": "The worm showed cephalic expansions, an esophagus, and the anterior end of the esophageal bulb. Eggs within the worm were flattened on one side, and their average size fell within the range for the species. The colon was the anatomical recovery site.", "z": "Enterobiasis (pinworm)", "s": "Adult worm recovered from the ascending colon during colonoscopy, examined on hematoxylin and eosin (H&E) stained slides.", "g": 0}, {"n": "Dicrocoelium dendriticum", "y": 2018, "c": 482, "m": "December", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2018/case482.html", "p": "A 48-year-old male immigrant from the Middle East had a stool examination for ova and parasites (O&P) as part of a refugee screening program. In wet mounts of the formalin-ethyl acetate (FEA) concentrated stool sample, the lab technician saw dark brown to amber-colored objects measuring 41-43 µm long by 25-28 µm wide.", "d": "The eggs have thick, dark brown shells and are embryonated, with an inconspicuous operculum. Their size (41-43 µm by 25-28 µm) falls within the range for […] (35-45 µm by 20-30 µm).", "f": "The eggs have thick, dark brown shells and are embryonated, with an inconspicuous operculum. Their size (41-43 µm by 25-28 µm) falls within the range for D. dendriticum (35-45 µm by 20-30 µm).", "z": "Dicrocoeliasis", "s": "Stool; O&P examination using FEA concentration, wet mount.", "g": 0}, {"n": "Plasmodium spp.", "y": 2018, "c": 480, "m": "November", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2018/case480.html", "p": "A man from New England returned from a trip to Africa with fever, chills, sweats, and fatigue. He saw his health care provider, who ordered a blood smear. The smear was prepared, stained with Wright-Giemsa, and examined, and was initially diagnosed as Babesia. The slides and a blood specimen were sent to the CDC for confirmation.", "d": "Thin, delicate rings, some with double chromatin dots, and developing […] with […] pigment were seen, along with macrophages containing engulfed pigment. The absence of pleomorphic parasites, along with these features, ruled out babesiosis.", "f": "Thin, delicate rings, some with double chromatin dots, and developing trophozoites with malarial pigment were seen, along with macrophages containing engulfed pigment. The absence of pleomorphic parasites, along with these features, ruled out babesiosis.", "z": "Malaria", "s": "Blood smear stained with Wright-Giemsa and examined at 1000x oil magnification.", "g": 0}, {"n": "Plasmodium spp.", "y": 2018, "c": 478, "m": "October", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2018/case478.html", "p": "A 4-year-old boy returned from a summer vacation in Tanzania with his parents, with fever and chills. He was evaluated at a clinic in St. Louis, Missouri, where blood smears were stained with Giemsa and examined at 1000x magnification with oil.", "d": "Band-form […] with coarse pigment, and ring stages with delicate cytoplasm and a prominent chromatin dot. Mature schizonts contain 8-12 merozoites with coarse, dark brown pigment. Infected red blood cells are normal to 0.75x in size, and the gametocytes appear to be macrogametocytes with compact, eccentric chromatin.", "f": "Band-form trophozoites with coarse pigment, and ring stages with delicate cytoplasm and a prominent chromatin dot. Mature schizonts contain 8-12 merozoites with coarse, dark brown pigment. Infected red blood cells are normal to 0.75x in size, and the gametocytes appear to be macrogametocytes with compact, eccentric chromatin.", "z": "Malaria", "s": "Giemsa-stained thin blood smear, examined by light microscopy at 1000x with oil immersion.", "g": 0}, {"n": "Strongyloides stercoralis", "y": 2018, "c": 470, "m": "June", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2018/case470.html", "p": "A 51-year-old immigrant man from Honduras was prescribed steroids at a health care facility for an asthma exacerbation. After he felt better, he continued to self-medicate with injectable steroids every three months, obtained by mail order from Honduras, for about one year. He returned with abdominal pain, worsening fatigue, shortness of breath, and bright red rectal bleeding. Specimens were biopsies taken from the terminal ileum to the rectum, and a sputum specimen.", "d": "Adult female worms with paired uterine tubes and a simple intestine, and numerous filariform larvae without reproductive structures, were seen. Infectious third-stage filariform larvae were identified by a 1:1 ratio of esophagus to intestine, and adult worms were detected in the setting of immunosuppression.", "f": "Adult female worms with paired uterine tubes and a simple intestine, and numerous filariform larvae without reproductive structures, were seen. Infectious third-stage filariform larvae were identified by a 1:1 ratio of esophagus to intestine, and adult worms were detected in the setting of immunosuppression.", "z": "Disseminated strongyloidiasis", "s": "Hematoxylin-and-eosin-stained sections of biopsies from the terminal ileum to the rectum; a cytospin smear of sputum, presumably Papanicolaou-stained.", "g": 0}, {"n": "Enterobius vermicularis", "y": 2018, "c": 468, "m": "May", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2018/case468.html", "p": "A 43-year-old woman born and raised in Manitoba, Canada, with no recent travel reported. An object estimated at 8 millimeters in length was found in her stool.", "d": "The worm is robust and has cephalic inflations. Its long, slender, tapered tail is a diagnostic feature of female worms of this species, and its size falls within the range for female […]. Eggs were not seen in utero, but the other features were sufficient for diagnosis.", "f": "The worm is robust and has cephalic inflations. Its long, slender, tapered tail is a diagnostic feature of female worms of this species, and its size falls within the range for female pinworms. Eggs were not seen in utero, but the other features were sufficient for diagnosis.", "z": "Enterobiasis (pinworm infection)", "s": "Stool specimen collected in SAF (sodium acetate-acetic acid-formalin).", "g": 0}, {"n": "Plasmodium spp.", "y": 2018, "c": 461, "m": "February", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2018/case461.html", "p": "A 12-year-old boy had fever and chills after returning from a one-month trip to an undisclosed West African country. He had not taken any […] prophylaxis before the trip. Blood smears were stained with Giemsa and examined at 1000x with oil at a pathology laboratory, and images were sent to the DPDx Team for identification.", "d": "Infected red blood cells showed Schüffner's stippling, elongation and/or fimbriation, and slight enlargement (1.2x to 1.5x). Only ring forms and immature […] were seen, which is unusual for this species, and PCR confirmed the result.", "f": "Infected red blood cells showed Schüffner's stippling, elongation and/or fimbriation, and slight enlargement (1.2x to 1.5x). Only ring forms and immature trophozoites were seen, which is unusual for this species, and PCR confirmed the result.", "z": "Malaria", "s": "Giemsa-stained thin blood smear, examined by light microscopy.", "g": 0}, {"n": "Taenia solium", "y": 2018, "c": 462, "m": "February", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2018/case462.html", "p": "A 17-year-old male presented with cellulitis and a mass in the eye that had developed over 3 months. The mass was at the limbus near the lateral rectus muscle. Surgical exploration revealed a sub-conjunctival cystic mass about 1 cm in diameter, which was excised and sent for pathologic examination. Images came from hematoxylin and eosin (H&E) stained sections.", "d": "The larval cestode shows a neck region with part of the scolex. Calcareous corpuscles are also present.", "f": "The larval cestode shows a neck region with part of the scolex. Calcareous corpuscles are also present.", "z": "Cysticercosis", "s": "Excised sub-conjunctival cystic mass, examined as H&E-stained histologic sections.", "g": 0}, {"n": "Plasmodium spp.", "y": 2018, "c": 460, "m": "January", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2018/case460.html", "p": "A 39-year-old man from Nigeria, who had recently returned from visiting his country of birth, presented with fever. Medical evaluation confirmed the fever and detected low hemoglobin. A Binax-NOW rapid […] test showed a strong T1 band and a weak T2 band. A blood smear was stained with Giemsa, and the parasite density was calculated at 0.5%.", "d": "Infected red blood cells were of normal size. Ring-stage parasites had delicate cytoplasm, and older […] were compact, some containing […] pigment. No other stages were observed.", "f": "Infected red blood cells were of normal size. Ring-stage parasites had delicate cytoplasm, and older trophozoites were compact, some containing malarial pigment. No other stages were observed.", "z": "Malaria", "s": "Blood smear, stained with Giemsa (thin smear).", "g": 0}, {"n": "Plasmodium spp.", "y": 2019, "c": 485, "m": "February", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2019/case485.html", "p": "A 62-year-old male presented with fever and chills after travel to Cambodia to visit relatives.", "d": "Infected red blood cells are normal to 0.75x in size. The band-form trophozoite has coarse pigment, and the mature schizont contains 8-12 merozoites with coarse, dark brown pigment. Ring stages with delicate cytoplasm and a prominent chromatin dot were noted, though these are not exclusive to this species. Gametocytes appear in normal to 0.75x-sized red blood cells.", "f": "Infected red blood cells are normal to 0.75x in size. The band-form trophozoite has coarse pigment, and the mature schizont contains 8-12 merozoites with coarse, dark brown pigment. Ring stages with delicate cytoplasm and a prominent chromatin dot were noted, though these are not exclusive to this species. Gametocytes appear in normal to 0.75x-sized red blood cells.", "z": "Malaria", "s": "Thick and thin blood smears, Giemsa-stained, examined at 1000x magnification under oil immersion.", "g": 0}, {"n": "Schistosoma haematobium", "y": 2019, "c": 487, "m": "March", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2019/case487.html", "p": "A 39-year-old journalist with extensive travel throughout the Middle East and Sub-Saharan Africa sought medical attention for dysuria and occasional hematuria that had progressed for several months. Urinalysis of a urine specimen showed few erythrocytes and epithelial cells. Cystoscopy revealed cysts in the bladder, and some were biopsied and sent to pathology. Objects of interest averaged 120 micrometers in length by 42 micrometers in width.", "d": "Eggs were consistent in size with […], and one egg showed the definitive terminal spine characteristic of this species.", "f": "Eggs were consistent in size with S. haematobium, and one egg showed the definitive terminal spine characteristic of this species.", "z": "Urogenital schistosomiasis", "s": "Urine for urinalysis; bladder cyst biopsy obtained during cystoscopy, examined as hematoxylin and eosin (H&E) stained sections.", "g": 0}, {"n": "Taenia saginata", "y": 2019, "c": 489, "m": "April", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2019/case489.html", "p": "A teenage female college student from Texas noticed a foreign object in her feces and took it to her school health clinic. She had no complaints of illness and no clinical symptoms, and she reported no domestic or foreign travel. Stool samples tested at the clinic were negative for ova and parasites. The state public health laboratory then sent images and the physical specimen to CDC for identification.", "d": "Mature proglottids were longer than broad, with a prominent unilateral genital pore on irregularly alternating sides. Injecting India ink into the genital pore showed about 17 primary uterine branches, which fits […] (12-30) rather than […] (7-13).", "f": "Mature proglottids were longer than broad, with a prominent unilateral genital pore on irregularly alternating sides. Injecting India ink into the genital pore showed about 17 primary uterine branches, which fits T. saginata (12-30) rather than T. solium (7-13).", "z": "Taeniasis", "s": "Stool (passed object); mature proglottids examined by the India ink technique", "g": 0}, {"n": "Wuchereria bancrofti", "y": 2019, "c": 491, "m": "May", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2019/case491.html", "p": "A 42-year-old missionary worker active on various western Pacific Islands sought care at a local health center for mild fevers and episodes of wheezing and coughing. A thick blood smear, stained with Giemsa, was examined and showed low numbers of objects averaging about 260 micrometers in length at 400x magnification.", "d": "The organisms are sheathed […] within the size range for […], with a visible but unstained sheath, a short head space, and a tail that tapers to a point. A discrete nuclear column runs through the body but does not extend to the tail tip.", "f": "The organisms are sheathed microfilariae within the size range for W. bancrofti, with a visible but unstained sheath, a short head space, and a tail that tapers to a point. A discrete nuclear column runs through the body but does not extend to the tail tip.", "z": "Lymphatic filariasis", "s": "Thick blood smear, stained with Giemsa", "g": 0}, {"n": "Balantidium coli", "y": 2019, "c": 496, "m": "July", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2019/case496.html", "p": "A 29-year-old female working as a primate intern at a zoo developed gastrointestinal symptoms, including diarrhea and cramping. Her health care provider performed a stool examination for ova and parasites (O & P).", "d": "Large ciliated […] within the expected size range for […] (40-200 micrometers) were observed. A cytostome was present at the tapered end.", "f": "Large ciliated trophozoites within the expected size range for B. coli (40-200 micrometers) were observed. A cytostome was present at the tapered end.", "z": "Balantidiasis", "s": "Stool; wet-mount preparation from a formalin-ethyl acetate concentration procedure.", "g": 0}, {"n": "Entamoeba histolytica", "y": 2019, "c": 497, "m": "August", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2019/case497.html", "p": "A 21-year-old exchange student from Nigeria presented to the University Clinic with a 3-day history of diarrhea, mild abdominal pain, loss of appetite, and fatigue. The organisms ranged in size from 12-26 μm.", "d": "The organisms showed an immature cyst with a single nucleus and single chromatoid body, and […] within the size range of […] . The nucleus had evenly distributed peripheral chromatin and a discrete, centrally or slightly eccentrically located karyosome, and an apparent ingested erythrocyte was seen.", "f": "The organisms showed an immature cyst with a single nucleus and single chromatoid body, and trophozoites within the size range of E. histolytica/dispar. The nucleus had evenly distributed peripheral chromatin and a discrete, centrally or slightly eccentrically located karyosome, and an apparent ingested erythrocyte was seen.", "z": "Amebiasis", "s": "Stool preserved in 10% formalin and Zn-PVA, examined by trichrome-stained slide of the Zn-PVA sample.", "g": 0}, {"n": "Plasmodium spp.", "y": 2019, "c": 499, "m": "September", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2019/case499.html", "p": "A 5-year-old child was taken to a children's hospital with a presumed febrile illness. Symptoms and travel history were not provided. A blood smear was prepared and stained, apparently with Wright-Giemsa. The state public health lab sent the slides to CDC/DPDx for diagnostic help. Sex was not stated.", "d": "Infected RBCs were slightly enlarged and oval or fimbriated, with coarse pigment in […], schizonts, and gametocytes. A schizont with about 8 large merozoites fell within the […] range (6-14) and outside the […] range (12-24).", "f": "Infected RBCs were slightly enlarged and oval or fimbriated, with coarse pigment in trophozoites, schizonts, and gametocytes. A schizont with about 8 large merozoites fell within the P. ovale range (6-14) and outside the P. vivax range (12-24).", "z": "Malaria", "s": "Blood smear, stained with Wright-Giemsa stain (microscopic examination)", "g": 0}, {"n": "Dicrocoelium dendriticum", "y": 2019, "c": 501, "m": "October", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2019/case501.html", "p": "A 72-year-old woman originally from China presented to a clinic with one week of abdominal pain, nausea, vomiting, and diarrhea. She also reported bouts of abdominal discomfort over the past year. ERCP demonstrated a live parasite in the common bile duct, which was removed, paraffin-embedded, sectioned, and stained with H&E.", "d": "Thick-shelled eggs about 35-45 µm with very inconspicuous shoulders and an operculum at one pole (visible mainly in cross-sections), differentiated miracidia within the eggs, and an aspinous tegument.", "f": "Thick-shelled eggs about 35-45 µm with very inconspicuous shoulders and an operculum at one pole (visible mainly in cross-sections), differentiated miracidia within the eggs, and an aspinous tegument.", "z": "Dicrocoeliasis", "s": "Adult fluke removed by ERCP from the common bile duct; processed by paraffin embedding, sectioning, and H&E staining.", "g": 0}, {"n": "Leishmania tropica", "y": 2019, "c": 505, "m": "December", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2019/case505.html", "p": "A male patient originally from Afghanistan, who had moved to the United States a few months earlier, sought care for a lesion on his hand. It first appeared about one year before and had recently grown considerably. He had no other symptoms, and the lesion was not itchy, painful, or discharging. Pathology of the biopsy reported lymphohistiocytic infiltrates. Part of the unpreserved biopsy was sent in universal transport medium to CDC. A Giemsa-stained touch prep was examined at 1000x oil immersion, where the objects of interest averaged 2.5-3.5 micrometers.", "d": "Numerous spherical or oval objects in the amastigote size range (1-5 micrometers) were seen, some with a large nucleus and a prominent dense dot-like or rod-like kinetoplast. Morphology alone supports only a genus-level diagnosis, and species must be determined by molecular analysis or isoenzyme analysis after culture.", "f": "Numerous spherical or oval objects in the amastigote size range (1-5 micrometers) were seen, some with a large nucleus and a prominent dense dot-like or rod-like kinetoplast. Morphology alone supports only a genus-level diagnosis, and species must be determined by molecular analysis or isoenzyme analysis after culture.", "z": "Cutaneous leishmaniasis", "s": "Unpreserved skin biopsy in universal transport medium; touch prep stained with Giemsa.", "g": 0}, {"n": "Plasmodium spp.", "y": 2020, "c": 507, "m": "January", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2020/case507.html", "p": "A 63-year-old man returned from visiting family in Nigeria. Three days before presenting to the clinic, he developed fever, chills, and a mild headache. He had taken no drug prophylaxis before or during the trip. A blood smear was ordered and stained with Giemsa.", "d": "Numerous ring-stage parasites appeared in the thick smears, with a rare schizont containing 9-10 merozoites and compact pigment. In the thin smears, infected red blood cells were normal in size, with applique forms and ring-stage parasites that had delicate cytoplasm.", "f": "Numerous ring-stage parasites appeared in the thick smears, with a rare schizont containing 9-10 merozoites and compact pigment. In the thin smears, infected red blood cells were normal in size, with applique forms and ring-stage parasites that had delicate cytoplasm.", "z": "Malaria", "s": "Peripheral blood smears (thick and thin), Giemsa-stained, with PCR testing confirming only P. falciparum.", "g": 0}, {"n": "Strongyloides stercoralis", "y": 2020, "c": 508, "m": "January", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2020/case508.html", "p": "A 69-year-old man from a rural town in Georgia presented to a county health clinic with productive cough with blood, rectal bleeding, and chest pain. He had no known travel history. Organisms measuring 271–378 µm were seen on wet-mount microscopy.", "d": "The organisms were consistent with filariform larvae, which can reach about 600 µm. Diagnostic features included a short, inconspicuous buccal canal, an esophagus-to-intestine length ratio of about 1:1, an inconspicuous genital primordium, and a notched tail.", "f": "The organisms were consistent with filariform larvae, which can reach about 600 µm. Diagnostic features included a short, inconspicuous buccal canal, an esophagus-to-intestine length ratio of about 1:1, an inconspicuous genital primordium, and a notched tail.", "z": "Strongyloidiasis, likely hyperinfection from autoinfection. The patient's immune status was not provided.", "s": "Bronchoalveolar wash fixed in Total-Fix and examined as a wet mount.", "g": 0}, {"n": "Schistosoma japonicum", "y": 2020, "c": 510, "m": "February", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2020/case510.html", "p": "A 29-year-old man sought care for an itchy, maculopapular rash on several areas of his body. He had traveled to the Philippines, where he swam in fresh water on the islands of Luzon and Mindanao. His provider requested a stool specimen for ova and parasite testing, and a few objects of interest were detected.", "d": "Large, rounded to oval eggs within the size range for […] (70–100 x 55–64 µm) were seen, each with a small spine and a miracidium inside. The miracidium's shape and the geographic origin excluded […].", "f": "Large, rounded to oval eggs within the size range for S. japonicum (70–100 x 55–64 µm) were seen, each with a small spine and a miracidium inside. The miracidium's shape and the geographic origin excluded S. mekongi.", "z": "Schistosomiasis (S. japonicum infection)", "s": "Stool, concentrated by the formalin-ethyl acetate method, with a wet mount smear made from the sediment.", "g": 0}, {"n": "Trichomonas vaginalis", "y": 2020, "c": 512, "m": "March", "u": "https://www.cdc.gov/dpdx/monthlycasestudies/2020/case512.html", "p": "A 29-year-old woman saw her primary care physician with a 15-day history of whitish vaginal discharge accompanied by itching and lower abdominal pain. Speculum examination showed an inflamed cervix with red, punctate lesions. A Pap smear collected during the exam was sent for Papanicolaou staining. The objects of interest measured 10-15 µm long.", "d": "The organism is pear-shaped (trophozoite) with several flagella projecting anteriorly and one flagellum at the opposite end. It has a large nucleus with an eccentric karyosome and measures about 10 x 7 µm, which falls within the size range for […].", "f": "The organism is pear-shaped (trophozoite) with several flagella projecting anteriorly and one flagellum at the opposite end. It has a large nucleus with an eccentric karyosome and measures about 10 x 7 µm, which falls within the size range for T. vaginalis.", "z": "Trichomoniasis", "s": "Pap smear stained with Papanicolaou stain, examined under oil immersion.", "g": 0}, {"n": "Trypanosoma gambi     if(!sim||typeof sim.title!=='string')sim=null;
    var d=el('dialog'),lab=sim?'Salva modifiche':'Pubblica';
    d.innerHTML='<h3 style="margin:0 0 8px">'+(sim?'Modifica simulatore':'Nuovo simulatore')+'</h3><label>Titolo</label><input id="n_t"><label>Descrizione breve</label><input id="n_d"><label>Icona (emoji)</label><input id="n_i" maxlength="4"><label>Immagine di anteprima (opzionale)</label><input id="n_g" type="file" accept="image/*">'+(sim&&sim.img?'<label style="display:flex;gap:8px;align-items:center"><input id="n_rm" type="checkbox" style="width:auto"> Rimuovi l\'immagine attuale</label>':'')+'<label>Carica file .html</label><input id="n_f" type="file" accept=".html,.htm"><label>…oppure incolla il codice HTML</label><textarea id="n_h"></textarea><div class="row"><button class="b" id="n_c">Annulla</button><button class="b p" id="n_s">'+lab+'</button></div>';
    document.body.appendChild(d);d.showModal();
    var $=function(i){return d.querySelector('#'+i)};
    $('n_t').value=sim?sim.title:'';$('n_d').value=sim?sim.desc:'';$('n_i').value=sim?sim.icon:'🧪';$('n_h').value=sim?sim.html:'';
    $('n_f').onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){$('n_h').value=r.result;if(!$('n_t').value)$('n_t').value=f.name.replace(/\.html?$/i,'')};r.readAsText(f)};
    $('n_c').onclick=function(){d.close();d.remove()};
    $('n_s').onclick=async function(){
      var t=$('n_t').value.trim(),h=$('n_h').value.trim();if(!t||!h){alert('Titolo e codice sono obbligatori');return}
      var b=this;b.disabled=true;b.textContent='Pubblicazione…';
      try{
        var img=sim?(sim.img||''):'',g=$('n_g').files[0];
        if(g)img=await resizeImg(g);else if($('n_rm')&&$('n_rm').checked)img='';
        var x={id:sim?sim.id:slug(t),title:t,desc:$('n_d').value.trim(),icon:$('n_i').value.trim()||'🧪',img:img,html:h,ts:Date.now()};
        await commit(function(txt){
          if(sim){var re=new RegExp('<template data-id="'+x.id+'"[\\s\\S]*?</template>\\n*');if(!re.test(txt))throw new Error('Simulatore non trovato nel file');return txt.replace(re,function(){return tplText(x)})}
          var k=txt.indexOf('<script id="main">');if(k<0)throw new Error('Struttura del file non riconosciuta');
          return txt.slice(0,k)+tplText(x)+txt.slice(k);
        },(sim?'Modificato':'Aggiunto')+' simulatore: '+t);
        var p=pend();p.edit=p.edit||{};
        if(sim&&p.add.some(function(a){return a.id===x.id}))p.add=p.add.map(function(a){return a.id===x.id?x:a});
        else if(sim)p.edit[x.id]=x;else p.add.push(x);
        setPend(p);d.close();d.remove();render();
        alert('Pubblicato. Sarà online per tutti entro circa 1 minuto.');
      }catch(e){alert(e.message);b.disabled=false;b.textContent=lab}
    };
  }

  window.addEventListener('hashchange',render);render();
})();
</script>
</body>
</html>
